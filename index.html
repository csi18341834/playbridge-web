<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>플레이브릿지 간편발주</title>
<meta property="og:title" content="플레이브릿지 인형뽑기(경품) 간편발주">
<meta property="og:description" content="뽑기방 사장님 전용 경품 간편발주 · 로그인 없이 바로 주문">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 도매 거래처 사장님용, 크고 또렷하게. 카톡으로 묻던 걸 화면이 먼저 답한다
   IDEA: 뽑기방 경품 주문 전표 — 품목코드·입수·팩단가·세팅팁이 한 장에
   PICTURE: 상품 카드 목록 + 베스트·신상 가로 진열대, 하단 고정 합계 바
   COLOUR/TYPE: 뽑기기계 노랑 #ffd23f, 먹색 #1d1a2b, 핑크 #ff3d7f / Noto Sans KR
   LAYOUT: 노란 머리(발송 안내·바로가기) → 검색·탭 → 진열대 → 카드 → 합계 바 → 시트형 창 */
:root{color-scheme:light;--bg:#fffaf0;--card:#fff;--ink:#1d1a2b;--sub:#5d5872;--line:#ece4d2;--y:#ffd23f;--pk:#ff3d7f;--pk2:#ffe3ec;--ok:#0b7a4b;--soft:#f6f0ff}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip;padding-bottom:110px;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
.top{background:var(--y);color:#1d1a2b;padding:12px max(4vw,16px) 10px}
.top h1{margin:0;font:900 clamp(21px,5.4vw,30px)/1.15 'Noto Sans KR',sans-serif;letter-spacing:-.02em}
.ship{margin:8px 0 0;font-size:17px;font-weight:700}
.ship b{background:#1d1a2b;color:#ffd23f;border-radius:8px;padding:1px 8px;white-space:nowrap}
.rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rules[hidden],.ship[hidden]{display:none}
.flow{margin:6px 0 0;font-size:15px;font-weight:700;line-height:1.4}
.rules span{background:rgba(29,26,43,.1);border-radius:999px;padding:3px 11px;font-size:14px;font-weight:700;white-space:nowrap}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-top:8px}
.acts button,.acts a{min-height:42px;border-radius:12px;border:2px solid #1d1a2b;background:#fff;color:#1d1a2b;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0 10px;text-align:center}
.acts .pri{background:#1d1a2b;color:#ffd23f}
.faq{display:grid;gap:10px;margin:12px 0 16px}
.faq details{border:2px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.faq details[open]{border-color:var(--ink)}
.faq summary{list-style:none;cursor:pointer;padding:14px 40px 14px 14px;font-size:17px;font-weight:700;line-height:1.4;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:900;color:var(--sub)}
.faq details[open] summary::after{content:'−'}
.faq .ans{margin:0 12px 12px;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:16px;line-height:1.6}
.big.faqk{display:flex;align-items:center;justify-content:center;text-decoration:none;background:#fee500;color:#191600;border:0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(4vw,16px)}
.sbox{display:flex;gap:6px}.sbox .search{flex:1;min-width:0}
.sbtn{flex:none;width:52px;height:48px;border:0;border-radius:12px;background:#1d1a2b;color:#ffd23f;display:grid;place-items:center}
.search{width:100%;height:48px;border:2px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);font-size:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs button{flex:none;height:40px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs .mine{border-color:var(--pk);color:var(--pk)}
.tabs .mine[aria-pressed=true]{background:var(--pk);color:#fff}
.shelf{padding:14px max(4vw,16px) 0}
.shelf h2{margin:0 0 8px;font-size:20px;font-weight:900;display:flex;align-items:baseline;gap:8px}
.shelf h2 small{font-size:13px;color:var(--sub);font-weight:500}
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.mini{flex:none;width:148px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;position:relative}
.mini .pic{width:100%;height:110px}
.mini .pic svg{width:86px;height:86px}
.mini .nm{font-size:15px;margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .pr{font-size:16px}
.rank{position:absolute;top:6px;left:6px;z-index:1;width:28px;height:28px;border-radius:9px;background:var(--ink);color:#ffd23f;font-weight:900;display:grid;place-items:center;font-size:15px}
.rank.r1{background:var(--pk);color:#fff}
.list{display:grid;gap:10px;padding:12px max(4vw,16px)}
@media(min-width:720px){.list{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.lh{padding:16px max(4vw,16px) 0;margin:0;font-size:20px;font-weight:900}
.it{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.it.on{border-color:var(--pk);box-shadow:0 0 0 2px var(--pk) inset}
.it.soldout{opacity:.7}
.pic{width:96px;height:96px;border-radius:12px;background:var(--soft);display:grid;place-items:center;border:0;padding:0;position:relative;overflow:hidden}
.pic svg{width:80px;height:80px}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .trk,.zp .trk{display:flex;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pic .trk::-webkit-scrollbar,.zp .trk::-webkit-scrollbar{display:none}
.pic .trk img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.zp .trk img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.zp{position:relative}
.cnt{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:700;background:rgba(29,26,43,.75);color:#fff;border-radius:6px;padding:0 5px;pointer-events:none}
.zp .cnt{left:10px;bottom:10px;font-size:13px;padding:1px 8px}
.zoom{pointer-events:none;position:absolute;right:4px;bottom:4px;font-size:11px;background:rgba(29,26,43,.75);color:#fff;border-radius:6px;padding:0 5px}
.code{font-size:13px;color:var(--sub);font-weight:700;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.badge{display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--pk);color:#fff}
.badge.g{background:var(--y);color:#1d1a2b}.badge.so{background:#888}.badge.l{background:var(--ok)}
.nm{font-weight:700;font-size:17px;line-height:1.3;margin:2px 0 4px}
.meta{font-size:14px;color:var(--sub)}
.chip{display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;border-radius:6px;padding:0 6px;border:1.5px solid var(--sub);color:var(--sub);margin:4px 4px 0 0}
.row{display:flex;align-items:end;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.pr{font-weight:900;font-size:20px;white-space:nowrap}
.pr small{display:block;font-weight:500;font-size:13px;color:var(--sub);white-space:normal}
.pr .pu{font-size:14px;font-weight:700;margin-right:4px;color:var(--sub)}
.pr .vx{font-size:11px;font-weight:700;color:var(--sub);margin-left:3px}
.pr .pm{font-size:14px;font-weight:700;color:var(--pk)}
.st{display:flex;align-items:stretch;border:2px solid var(--ink);border-radius:12px;overflow:hidden;min-height:46px;background:var(--card);flex:none;max-width:100%}
.st button{min-width:44px;width:1.9em;border:0;background:transparent;font-size:24px;font-weight:700;line-height:1;padding:0;flex:none}
.st button:disabled{opacity:.3;cursor:default}
.st input{width:2.7em;min-width:46px;border:0;text-align:center;font-weight:900;font-size:18px;background:transparent;padding:0;flex:none}
.st input::placeholder{color:var(--sub);opacity:.6}
.st .u{font-size:12px;margin-right:2px;align-self:center;white-space:nowrap}
.notify{min-height:46px;border:2px solid var(--ink);border-radius:12px;background:var(--card);font-weight:700;padding:0 12px}
.empty{padding:40px 16px;text-align:center;color:var(--sub)}
.note{font-size:13px;color:var(--sub);text-align:center;padding:0 16px 8px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--ink);color:#fff;padding:10px max(4vw,16px) calc(10px + env(safe-area-inset-bottom))}
.foot .wrap{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.sum{flex:1 1 9em;min-width:0;border:0;background:none;color:inherit;text-align:left;padding:0}
.sum b{font-size:22px;font-weight:900;white-space:nowrap}
.sum div{font-size:13px;opacity:.85;overflow-wrap:anywhere}
.go{min-height:54px;height:auto;margin-left:auto;flex:0 0 auto;line-height:1.2;padding:8px 22px;border:0;border-radius:14px;background:var(--pk);color:#fff;font-weight:900;font-size:18px;white-space:nowrap}
.go:disabled{background:#77738a;cursor:default}
.prog{height:6px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--y);width:0;transition:width .25s}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,8,20,.55);display:none;align-items:end;justify-content:center}
.sheet.show{display:flex}
.sheet{overscroll-behavior:contain}
body.lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.pane{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:20px max(4vw,16px) calc(24px + env(safe-area-inset-bottom))}
.pane h2{margin:0 0 4px;font-size:24px;font-weight:900;line-height:1.25}
.x{flex:none;width:44px;height:44px;border:0;background:transparent;font-size:28px;margin:-6px -6px 0 0;color:var(--ink)}
.ph{position:sticky;top:-20px;z-index:5;background:var(--bg);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:-20px calc(-1*max(4vw,16px)) 4px;padding:20px max(4vw,16px) 8px;border-bottom:1px solid var(--line)}
.ph h2{flex:1;min-width:0}
.lines{margin:12px 0;border-top:2px solid var(--ink)}
.lines div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.lines span:first-child{flex:1}.lines span:last-child{flex:none;white-space:nowrap;font-weight:700}
.lines .li{display:block}
.lines .li .lt{display:flex;justify-content:space-between;gap:10px;padding:0;border:0}
.lines .li .lc{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:8px 0 0;border:0}
.lines .li .st{padding:0;border:2px solid var(--ink);min-height:42px}
.lines .li .lc .del{min-height:42px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;font-weight:700;color:var(--sub)}
.lines .warn{display:block;padding:10px 12px;margin-top:8px;border:0;border-radius:10px;background:var(--soft);color:var(--pk);font-weight:700;font-size:15px}
.lines .tot{font-size:18px;font-weight:900;border-bottom:2px solid var(--ink)}
.chip.moq{background:#ffe3ee;border-color:var(--pk);color:var(--pk);font-size:13px;padding:1px 8px}
.clrall{grid-column:1/-1;min-height:48px;border:2px solid var(--pk);border-radius:12px;background:var(--card);color:var(--pk);font-size:16px;font-weight:900}
.clrall.arm{background:var(--pk);color:#fff}
.oclr{margin-left:auto;min-height:36px;padding:0 12px;border:1.5px solid var(--sub);border-radius:10px;background:var(--card);color:var(--sub);font-size:14px;font-weight:700}
.osum>b{flex:1}
.more{display:block;width:100%;min-height:48px;margin:6px 0 10px;border:2px solid var(--ink);border-radius:12px;background:var(--card);font-size:16px;font-weight:900;color:var(--ink)}
.skipnote{margin:10px max(4vw,16px) 0;padding:12px 14px;border:2px solid var(--pk);border-radius:12px;background:#ffe3ee;font-size:15px;line-height:1.5}
.skipnote b{display:block;color:var(--pk)}.skipnote button{margin-top:8px;min-height:40px;padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:700}
.bank{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:15px;line-height:1.5}
.bank b{display:block}.bank .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sug{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:10px;margin:10px 0}
.sug .pic{width:60px;height:60px;flex:none}.sug .pic svg{width:50px;height:50px}
.sug p{margin:0;flex:1;font-size:14px}.sug p b{display:block;font-size:15px}
.sug button{flex:none;min-height:44px;border:0;border-radius:10px;background:var(--pk);color:#fff;font-weight:900;padding:0 14px}
label{display:block;font-weight:700;margin:14px 0 6px}
label em{font-style:normal;color:var(--pk)}
.f{width:100%;min-height:50px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card);font-size:16px}
textarea.f{min-height:80px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin-top:10px}
.optb{min-height:46px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:900;font-size:15px;padding:0 12px;max-width:100%;text-align:center;line-height:1.3}
.optb.on{background:var(--ink);color:#fff}
.ops{border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin:10px 0}
.opl{display:block;font-size:15px;margin-bottom:4px}
.opr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.opl small{font-weight:700;color:var(--sub)}
.des{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:4px 0 12px}
.dz{position:relative;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);font-size:12px;font-weight:700;line-height:1.2;min-height:48px}
.dz img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--soft)}
.dz.on{border-color:var(--pk);box-shadow:0 0 0 2px var(--pk)}
.dz i{position:absolute;top:2px;right:2px;font-style:normal;background:var(--pk);color:#fff;border-radius:9px;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;padding:0 4px}
.osum{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;font-weight:700;color:var(--pk)}
.osum>b{color:var(--ink)}
.oc{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--pk);border-radius:10px;padding:3px 3px 3px 3px;background:var(--card)}
.ocx{width:32px;height:32px;border:0;border-radius:8px;background:var(--soft);color:var(--ink);font-size:20px;font-weight:900;line-height:1;flex:none}
.tn{width:36px;height:36px;object-fit:cover;border-radius:7px;background:var(--soft);flex:none}
.tn.ln{width:32px;height:32px;vertical-align:middle;margin-right:6px}
.osel{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:8px;margin:2px 0 8px}
.ph-img{display:grid;place-items:center;width:100%;height:100%;min-height:36px;flex:none}.ph-img svg{width:100%;height:100%}
.ph-img.tn{display:inline-grid;min-height:0;overflow:hidden;width:36px;height:36px}.ph-img.tn.ln{width:32px;height:32px;vertical-align:middle}
.osel .ph-img.big{width:84px;height:84px;min-height:0;overflow:hidden;border-radius:10px}
.dz .ph-img{min-height:0;width:100%;height:auto;aspect-ratio:1;overflow:hidden;border-radius:8px}
.osel .big{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--card);flex:none}
.osel small{display:block;font-size:13px;color:var(--sub);font-weight:700}.osel b{font-size:20px;font-weight:900}
.opr:first-of-type{border-top:0}.opr>span{font-size:18px;font-weight:900}
.chk input{width:24px;height:24px;accent-color:var(--pk);flex:none}
.known{background:var(--pk2);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px}
.known b{display:block;margin-bottom:2px}
.stores{display:grid;gap:8px;margin-top:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--card);cursor:pointer}
.opt input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--pk);flex:none}
.opt b{display:block;font-size:16px;line-height:1.3;word-break:keep-all}
.opt span{display:block;font-size:14px;color:var(--sub)}
.opt:has(input:checked){border-color:var(--pk);background:var(--pk2)}
.hint{margin:4px 0 0;font-size:14px;line-height:1.5;word-break:keep-all}
.known .row{margin-top:4px;word-break:keep-all}
.cpHelp{background:var(--soft);border-radius:12px;padding:12px 14px;margin:8px 0 0;font-size:15px;line-height:1.6;word-break:keep-all}
.cpHelp.on{outline:3px solid var(--pk)}
.lk{border:0;background:none;color:var(--pk);font-weight:700;text-decoration:underline;padding:6px 0;min-height:36px}
.srch{width:100%;min-height:50px;border:2px solid var(--ink);border-radius:12px;background:var(--y);color:#1d1a2b;font-weight:900;font-size:16px;margin-bottom:8px}
.pcwrap{height:440px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin-bottom:8px;position:relative}
.pcx{position:absolute;top:6px;right:6px;z-index:2;width:40px;height:40px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:22px}
#addr2{margin-top:8px}
.err{color:var(--pk);font-weight:700;font-size:14px;margin-top:8px;min-height:1.2em}
.big{width:100%;min-height:58px;border:0;border-radius:14px;background:var(--pk);color:#fff;font-weight:900;font-size:19px;margin-top:10px}
.big:disabled{opacity:.6}
.ghost{width:100%;min-height:50px;border:2px solid var(--ink);border-radius:14px;background:transparent;font-weight:700;margin-top:8px}
.kk{display:flex;align-items:center;justify-content:center;text-decoration:none;color:#1d1a2b;background:#fee500;border-color:#fee500;font-weight:900}
.kkNote{font-size:13px;color:var(--sub);text-align:center;margin-top:6px}
.out{white-space:pre-wrap;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:15px;margin:12px 0;max-height:30vh;overflow:auto}
.ok{color:var(--ok);font-weight:900;font-size:20px;margin:6px 0}
.pay{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:16px;margin:12px 0}
.pay .amt{font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pay .acc{font-size:17px;font-weight:700;margin-top:10px}
.prepay{margin-top:12px;background:#fff6cc;border:2px solid #ffd23f;border-radius:12px;padding:12px 14px;color:#1d1a2b;font-size:15px;line-height:1.5;word-break:keep-all}

<script>
/* ===== 외부 정적 페이지용 부트 (tools/build_static.py 가 자동으로 넣음, 직접 고치지 말 것) ===== */
const API_URL='https:\/\/script.google.com/macros/s/AKfycbwyEpDKKX4pif4FgYtxrepxrqzmCJDM4NmHcb29SrzkMXCPEHMVAwYxdtpEuCwtFCGxyw/exec';
/* 서버 호출: 헤더를 따로 붙이지 않아(text/plain) 브라우저 CORS 사전요청 없이 Apps Script doPost 로 감 */
function runServer(action,payload){
  return fetch(API_URL,{method:'POST',body:JSON.stringify({action,payload}),redirect:'follow'})
    .then(r=>{if(!r.ok)throw new Error('서버 연결이 잠시 원활하지 않습니다. 잠시 후 다시 시도해 주세요.');return r.json()})
    .then(j=>{if(!j||!j.ok)throw new Error((j&&j.error)||'처리하지 못했습니다. 잠시 후 다시 시도해 주세요.');return j.data});
}
/* 기존 화면 코드가 쓰는 google.script.run.withSuccessHandler(ok).withFailureHandler(no).함수(...) 모양 그대로 */
(function(){
  const ARGS={lookupClient:n=>({name:n}),getLastOrder:(n,l)=>({name:n,last4:l}),lookupOrders:(n,l)=>({name:n,last4:l}),
    submitOrder:o=>o,requestRestock:(c,n,t)=>({code:c,name:n,tel:t})};
  const mk=(ok,no)=>new Proxy({},{get(_,k){
    if(k==='withSuccessHandler')return h=>mk(h,no);
    if(k==='withFailureHandler')return h=>mk(ok,h);
    return (...a)=>{const f=ARGS[k];if(!f){(no||function(){})(new Error('알 수 없는 요청입니다.'));return}
      runServer(k,f(...a)).then(d=>ok&&ok(d),e=>no&&no(e))};
  }});
  window.google={script:{run:mk(null,null)}};
})();
/* 화면 데이터: 한 번 받은 데이터는 폰에 저장해 두고 다음부터는 바로 화면을 띄운 뒤, 최신 데이터를 뒤에서 받아 비교.
   상품 목록·가격·품절·설정이 바뀌었으면 그때만 한 번 새로 고침 (재고 숫자만 바뀐 건 다음 방문 때 반영, 주문 때 서버가 다시 확인) */
const BOOT_KEY='pb_boot_v1';
function bootSig(d){try{return JSON.stringify([d.cfg,(d.products||[]).map(p=>[p.c,p.price,p.moq,p.tag,p.n,p.img,p.opts,p.opts2])])}catch(e){return ''}}
function startApp(d){
  d=JSON.parse(JSON.stringify(d));
  const want=(new URLSearchParams(location.search).get('item')||'').trim().toUpperCase();   /* 상품 바로가기 ?item=코드 */
  const hit=(d.products||[]).find(p=>String(p.c).toUpperCase()===want);
  d.open=hit?hit.c:'';
  d.cfg=d.cfg||{};d.cfg.url='https:\/\/playbridge.io.kr';   /* 카톡 공유 링크는 우리 도메인으로 */
  document.getElementById('data').textContent=JSON.stringify(d);
  const box=document.getElementById('bootMsg');if(box)box.hidden=true;
  const s=document.createElement('script');s.textContent=document.getElementById('app').textContent;document.body.appendChild(s);
}
function fetchBoot(){return fetch(API_URL+'?action=bootstrap',{redirect:'follow'}).then(r=>r.json()).then(j=>{if(!j||!j.ok)throw new Error((j&&j.error)||'load');return j.data})}
function bootApp(){
  const box=document.getElementById('bootMsg'),list=document.getElementById('list');
  if(box&&list&&box.nextSibling!==list)list.parentNode.insertBefore(box,list);   /* 안내는 상품 목록 자리에 */
  let saved=null;try{saved=JSON.parse(localStorage.getItem(BOOT_KEY)||'null')}catch(e){}
  /* 페이지 안에 미리 넣어 둔 데이터(10분마다 자동 갱신) — 처음 오신 분도 기다림 없이 바로 화면 */
  let snap=null;try{snap=JSON.parse((document.getElementById('snap')||{}).textContent||'null')}catch(e){}
  if(snap&&snap.d&&(!saved||!saved.d||(snap.t||0)>(saved.t||0)))saved=snap;
  if(saved&&saved.d&&Date.now()-(saved.t||0)<7*864e5){
    startApp(saved.d);
    fetchBoot().then(d=>{try{localStorage.setItem(BOOT_KEY,JSON.stringify({t:Date.now(),d}))}catch(e){}
      if(bootSig(d)!==bootSig(saved.d)&&!sessionStorage.getItem('pb_rl')){try{sessionStorage.setItem('pb_rl','1')}catch(e){}location.reload()}
    }).catch(()=>{});
    return;
  }
  if(box){box.hidden=false;box.innerHTML='상품을 불러오는 중입니다…'}
  fetchBoot().then(d=>{try{localStorage.setItem(BOOT_KEY,JSON.stringify({t:Date.now(),d}))}catch(e){}startApp(d)})
  .catch(()=>{if(box){box.hidden=false;box.innerHTML='상품을 불러오지 못했습니다.<br><button type="button" onclick="bootApp()">다시 불러오기</button>'}});
}
document.addEventListener('DOMContentLoaded',bootApp);
</script>

async function copy(text,msg){
  try{await navigator.clipboard.writeText(text)}
  catch(e){const a=document.createElement('textarea');a.value=text;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
  toast(msg||'복사되었습니다');
}

function imgFail(img){

}

/* ---------- 목록 ---------- */
function tabs(){
  const n=Object.keys(cart).length;
  $('tabs').innerHTML=CATS.map(c=>`<button type="button" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join('')+
    `<button type="button" class="mine" data-c="${MINE}" aria-pressed="${cat===MINE}">${MINE} ${n}</button>`;
}
const rank=p=>p.tag==='out'?4:p.isNew?0:p.best?1:p.tag==='hot'?2:3;
function card(p){
  const n=qOf(p),out=p.tag==='out';
  return `<article class="it${n?' on':''}${out?' soldout':''}">
    <div class="pic" data-z="${esc(p.c)}" role="button" tabindex="0" aria-label="${esc(p.n)} 크게 보기">${gallery(p,400)}<span class="zoom">크게</span></div>
    <div>

      ${has2(p)?`<div class="meta">${esc(p.optLabel2)} ${p.opts2.length}종 중 선택</div>`:''}${has1(p)?`<div class="meta">${esc(p.optLabel)}: ${p.opts.map(esc).join(' · ')}</div>`:''}
      <div>${p.moq>1?`<span class="chip moq">최소 ${p.moq}팩</span>`:''}</div>
      <div class="row">
        <div class="pr"><span class="pu">개당</span>${won(per(p))}<span class="vx">VAT별도</span><small class="pm">최소 ${p.moq}팩 ${won(moqWon(p))}</small><small>${esc(p.lead)}</small></div>
        ${out?`<button type="button" class="notify" data-r="${esc(p.c)}">입고 알림 받기</button>`:hasOpt(p)?optBtn(p):`
        <div class="st" role="group" aria-label="${esc(p.n)} 수량">
          <button type="button" data-d="-1" data-k="${esc(p.c)}" ${!n?'disabled':''} aria-label="한 팩 빼기">−</button>
          <input class="qty" data-qk="${esc(p.c)}" inputmode="numeric" pattern="[0-9]*" value="${n||''}" placeholder="0" aria-label="팩 수량">
          <span class="u">팩</span>
          <button type="button" data-d="1" data-k="${esc(p.c)}" aria-label="한 팩 더하기">+</button>
        </div>`}
      </div>
    </div>
  </article>`;
}
function optBtn(p){const n=qOf(p);return `<button type="button" class="optb${n?' on':''}" data-z="${esc(p.c)}">${n?esc(optTxt(p))+' · 바꾸기':esc([p.optLabel2,p.optLabel].filter(Boolean).join('·'))+' 고르고 담기'}</button>`}
function mini(p,r){
  return `<button type="button" class="mini" data-z="${esc(p.c)}">${r?`<span class="rank${r===1?' r1':''}">${r}</span>`:''}
    <div class="pic">${charm(p)}</div><div class="nm">${esc(p.n)}</div><div class="pr"><span class="pu">개당</span>${won(per(p))}<span class="vx">VAT별도</span></div>
    <div class="meta">${p.pack}개입 · 최소 ${p.moq}팩 ${won(moqWon(p))}${qOf(p)?` · <b style="color:var(--pk)">${qOf(p)}팩 담음</b>`:''}</div></button>`;
}
function shelves(){
  if(cat!=='전체'||q.trim()){$('shelves').innerHTML='';$('lh').hidden=true;return}
  const best=P.filter(p=>p.best&&p.tag!=='out').sort((a,b)=>a.best-b.best);
  const fresh=P.filter(p=>p.isNew&&p.tag!=='out');
  $('shelves').innerHTML=
    (best.length?`<section class="shelf"><h2>요즘 베스트 <small>최근 많이 나간 순</small></h2><div class="rail">${best.map(p=>mini(p,p.best)).join('')}</div></section>`:'')+
    (fresh.length?`<section class="shelf"><h2>새로 들어왔습니다 <small>유행 신상</small></h2><div class="rail">${fresh.map(p=>mini(p,0)).join('')}</div></section>`:'');
  $('lh').hidden=!(best.length||fresh.length);
}
function render(){
  tabs();shelves();
  const k=norm(q);
  let rows=P.filter(p=>(cat==='전체'||(cat===MINE?qOf(p)>0:cat===NEW?p.isNew:cat===BEST?p.best:p.cat===cat))&&(!k||norm(p.n+p.c).includes(k)));
  rows=cat===BEST?rows.sort((a,b)=>a.best-b.best):rows.map((p,i)=>[p,i]).sort((a,b)=>rank(a[0])-rank(b[0])||a[1]-b[1]).map(x=>x[0]);
  const clr=cat===MINE&&Object.keys(cart).length?'<button type="button" class="clrall" id="clrAll">장바구니 전체 비우기</button>':'';
  $('list').innerHTML=rows.length?clr+rows.map(card).join(''):`<div class="empty">${DATA.failed?'상품을 불러오지 못했습니다. 창을 닫고 다시 열어 주세요.':cat===MINE?'아직 담은 상품이 없습니다.':'찾는 품목이 없습니다. 다른 이름으로 검색해 주세요.'}</div>`;
  totals();
  if($('sumBox')&&$('sheet').classList.contains('show'))refreshSum();   // 주문 확인 창이 열려 있으면 금액·배송비·버튼을 바로 다시 계산
}

/* ---------- 수량 ---------- */
function setQty(code,v,silent){
  const p=pOf(code);if(!p||p.tag==='out')return;
  if(hasOpt(p)&&!okKey(p,code)){zoom(p.c);return}
  v=Math.min(999,Math.max(0,parseInt(v,10)||0));
  if(!hasOpt(p)&&v>0&&v<p.moq){v=p.moq;if(!silent)toast(`${p.n.split(' (')[0]}: 최소 ${p.moq}팩부터라 ${p.moq}팩 담았습니다`)}
  const room=roomOf(p,code);   // 재고 숫자가 적힌 상품: 남은 팩 수까지만 (옵션은 합계로)
  if(v>room){v=room;toast(`${p.n.split(' (')[0]}: 남은 재고가 ${p.maxQ}팩이라 ${p.maxQ}팩까지만 담을 수 있습니다`)}
  if(v)cart[code]=v;else delete cart[code];
  render();zSync();
}
const roomOf=(p,key)=>p.maxQ==null?999:Math.max(0,p.maxQ-(qOf(p)-(cart[key]||0)));
/* 저장된 장바구니·지난 주문을 담을 때 재고를 넘는 수량은 줄임. 줄인 상품 이름 목록을 돌려줌 */
function fitStock(){const cut=[];
  P.forEach(p=>{if(p.maxQ==null)return;let over=qOf(p)-p.maxQ;if(over<=0)return;cut.push(p.n.split(' (')[0]);
    Object.keys(cart).filter(k=>kc(k)===p.c).reverse().forEach(k=>{if(over<=0)return;const d=Math.min(over,cart[k]);cart[k]-=d;over-=d;if(!cart[k])delete cart[k]})});
  return cut}
function step(code,d){
  const p=pOf(code),n=cart[code]||0;if(!p)return;
  if(hasOpt(p)&&!okKey(p,code)){zoom(p.c);return}
  if(hasOpt(p)){setQty(code,n+d,true);return}   // 옵션 상품: 1팩씩 자유롭게, 최소주문은 상품 합계로 확인
  if(d>0){setQty(code,n<p.moq?p.moq:n+1);if(!n&&p.moq>1)toast(`최소 ${p.moq}팩부터라 ${p.moq}팩 담았습니다`)}
  else setQty(code,n-1<p.moq?0:n-1,true);
}

/* ---------- 합계 ---------- */
function calc(){
  const items=Object.keys(cart).map(k=>{const p=pOf(k);if(!p||!(cart[k]>0))return null;
    return{...p,key:k,opt:optOf(k),n:optName(p,k),q:cart[k],sum:p.price*cart[k]}}).filter(Boolean);
  const sub=items.reduce((a,b)=>a+b.sum,0),packs=items.reduce((a,b)=>a+b.q,0);
  const ship=sub>=CFG.freeShip||!sub?0:CFG.shipFee;
  return{items,sub,packs,ship,tot:sub+ship};
}
/* 담은 상품 임시저장: 카톡 창을 닫거나 뒤로가기 해도 유지 (2주 보관) */
const CART_KEY='kr_cart';
function saveCart(){store.set(CART_KEY,{t:Date.now(),items:cart})}
function loadCart(){
  const s=store.get(CART_KEY);if(!s||!s.items||Date.now()-(s.t||0)>14*864e5)return 0;
  let n=0;for(const c in s.items){const p=pOf(c),v=parseInt(s.items[c],10)||0;if(!p||p.tag==='out'||v<1||!okKey(p,c))continue;cart[c]=Math.min(999,hasOpt(p)?v:Math.max(v,p.moq));n++}
  if(n){const cut=fitStock();if(cut.length)setTimeout(()=>toast(`재고가 줄어 수량을 맞췄습니다: ${cut.join(', ')}`),600)}
  return n;
}
function totals(){
  const t=calc();saveCart();
  $('total').textContent=won(t.tot);
  $('sumInfo').textContent=!t.sub?'담은 상품이 없습니다':`${t.items.length}품목 ${t.packs}팩 · `+(t.sub<CFG.minOrder?`최소주문까지 ${won(CFG.minOrder-t.sub)}`:t.sub<CFG.freeShip?`무료배송까지 ${won(CFG.freeShip-t.sub)}`:'무료배송 적용');
  const goal=t.sub<CFG.minOrder?CFG.minOrder:CFG.freeShip;
  $('prog').style.width=Math.min(100,t.sub/goal*100)+'%';
  const short=P.filter(moqShort);
  $('go').disabled=t.sub<CFG.minOrder||short.length>0;
  $('go').textContent=short.length?'최소 수량 확인':t.sub&&t.sub<CFG.minOrder?'최소주문 미달':'주문하기';
  if(short.length)$('sumInfo').textContent=`${short[0].n.split(' (')[0]}: 최소 ${short[0].moq}팩부터 (현재 ${qOf(short[0])}팩)`;
  if(!$('fv').hidden)fvSync(t);
}

/* ---------- 창 ---------- */
function openPane(html){const m=html.match(/^\s*(<h2[\s\S]*?<\/h2>)/);const h=m?m[1]:'',rest=m?html.slice(m[0].length):html;
  $('pane').innerHTML=`<div class="ph">${h}<button class="x" type="button" data-close aria-label="닫기">×</button></div>`+rest;lockBg();$('sheet').classList.add('show');$('pane').scrollTop=0}
/* 창이 열려 있는 동안 뒤 화면 고정 (창 안에서 스크롤하거나 입력칸을 눌러도 뒤 목록이 같이 움직이지 않게) */
let lockY=null;
function lockBg(){if(lockY!==null)return;lockY=window.scrollY||0;document.body.style.top=(-lockY)+'px';document.body.classList.add('lock')}
function unlockBg(){if(lockY===null)return;const y=lockY;lockY=null;document.body.classList.remove('lock');document.body.style.top='';window.scrollTo(0,y)}
function close(){$('sheet').classList.remove('show');unlockBg()}

/* 카톡 단톡방 공유 문구: 상품명·구성·가격 + 이 상품으로 바로 가는 링크 */
function shareText(p){
  const link=(CFG.url||'(주문 링크)')+'?item='+encodeURIComponent(p.c);
  return `${p.isNew?'🆕 신상 입고!':'📢 추천 상품!'} ${p.n.split(' (')[0]} ${p.pack}개입 ${won(p.price)}\n바로 주문 👉 ${link}`;
}

/* 크게 보기 */
function zoom(code){
  const p=byCode(code);if(!p)return;
  if(has2(p)){const k=Object.keys(cart).find(k=>kc(k)===p.c&&ko2(k));zDes=k?ko2(k):p.opts2[0]}
  const n=qOf(p),out=p.tag==='out';
  openPane(`<h2 id="sh">${esc(p.n)}</h2><div class="code">${esc(p.c)}${badges(p)}</div>
    <div class="zp">${gallery(p,1200)}</div>
    ${hasOpt(p)&&!out?`<div class="ops" id="zOpts" data-p="${esc(p.c)}">${optRows(p)}</div>`:''}
    <dl class="dl">
      <dt>구성</dt><dd>1팩 ${p.pack}개입${p.size?' · '+esc(p.size):''}</dd>
      <dt>가격</dt><dd><b>개당 ${won(per(p))}</b> (VAT 별도)<br>1팩 ${won(p.price)} · 최소 ${p.moq}팩 = ${won(moqWon(p))} (VAT 포함)</dd>
      ${p.box?`<dt>박스 입수</dt><dd>${esc(p.box)}</dd>`:''}
      <dt>최소 주문</dt><dd>${p.moq}팩</dd>
      ${p.lead?`<dt>출고</dt><dd>${esc(p.lead)}</dd>`:''}
    </dl>
    ${p.tip?`<div class="tip"><b>상품 설명</b>${tipHtml(p.tip)}</div>`:''}
    <button class="ghost" type="button" data-share="${esc(p.c)}">카톡 공유 문구 복사</button>
    <div class="zfoot">${out?`<button class="big" type="button" data-r="${esc(p.c)}">입고 알림 받기</button>`:
      `<button class="big" type="button" id="zAdd">${hasOpt(p)?optFoot(p):n?`${n}팩 담겨 있습니다 · 1팩 더 담기`:`${p.moq}팩 담기`}</button>`}</div>`);
  const b=$('zAdd');if(b)b.addEventListener('click',()=>{
    if(hasOpt(p)){if(moqShort(p)){toast(`최소 ${p.moq}팩부터 주문 가능합니다 (현재 ${qOf(p)}팩)`);return}if(qOf(p)){toast(`${optTxt(p)} 담았습니다`);close()}else{toast(has2(p)?`${eul(p.optLabel2)} 고르고 + 를 눌러 수량을 정해 주세요`:`${p.optLabel}별로 + 를 눌러 수량을 정해 주세요`);const o=$('zOpts');if(o)o.scrollIntoView({block:'center',behavior:'smooth'})}return}
    if(p.maxQ!=null&&(cart[p.c]||0)>=p.maxQ){toast(`남은 재고가 ${p.maxQ}팩이라 더 담을 수 없습니다`);return}
    step(p.c,1);toast(`${cart[p.c]}팩 담았습니다`);close()});
}
/* 옵션 상품: 사이즈별 수량 */
function optRows(p){
  const pics=picsOf(p),d=has2(p)?zDes:'';
  const des=has2(p)?`<b class="opl">① ${esc(p.optLabel2)} 고르기 <small>${p.opts2.length}종</small></b><div class="des">`+p.opts2.map((o,i)=>{
      const q=Object.keys(cart).filter(k=>kc(k)===p.c&&ko2(k)===o).reduce((a,k)=>a+cart[k],0);
      return `<button type="button" class="dz${o===d?' on':''}" data-des="${esc(o)}" aria-pressed="${o===d}">${pics[i]?`<img src="${esc(sized(pics[i],200))}" alt="" loading="lazy" data-c="${esc(p.c)}">`:''}<span>${esc(o)}</span>${q?`<i>${q}</i>`:''}</button>`}).join('')+'</div>':'';
  const sizes=has1(p)?p.opts:[''];
  const rows=(d?`<div class="osel">${thumb(desPic(p,d,300),'big')}<div><small>고른 ${esc(p.optLabel2)}</small><b>${esc(d)}</b></div></div>`:'')+
    `<b class="opl">${has2(p)?'② ':''}${has1(p)?esc(p.optLabel)+'별 ':''}수량 (팩)</b>`+sizes.map(o=>{const k=p.c+'|'+o+(d?'|'+d:''),n=cart[k]||0;return `<div class="opr"><span>${esc(o||'수량')}</span>
    <div class="st" role="group" aria-label="${esc(o||'수량')}">
      <button type="button" data-d="-1" data-k="${esc(k)}" ${!n?'disabled':''} aria-label="${esc(o)} 한 팩 빼기">−</button>
      <input class="qty" data-qk="${esc(k)}" inputmode="numeric" pattern="[0-9]*" value="${n||''}" placeholder="0" aria-label="${esc(o)} 팩 수량">
      <span class="u">팩</span>

/* ---------- 주문 ---------- */
function suggest(t){
  if(t.sub<CFG.minOrder||t.sub>=CFG.freeShip)return null;
  const gap=CFG.freeShip-t.sub,mix=p=>/믹스|세트/.test(p.n+p.cat)?0:1;
  return P.filter(p=>p.tag!=='out'&&!hasOpt(p)&&!qOf(p)&&(p.maxQ==null||p.maxQ>=p.moq)&&p.price*p.moq>=gap)
    .sort((a,b)=>mix(a)-mix(b)||(b.best?1:0)-(a.best?1:0)||a.price*a.moq-b.price*b.moq)[0]||null;
}
function sumBlock(){
  const t=calc(),s=suggest(t);
  const k=i=>esc(i.key);
  return `<div class="lines">${t.items.map(i=>`<div class="li"><div class="lt"><span>${thumb(desPic(i,ko2(i.key)),'tn ln',i.c)}${esc(i.c)} ${esc(i.n)}</span><span>${won(i.sum)}</span></div>
      <div class="lc"><div class="st" role="group" aria-label="${esc(i.n)} 수량">
        <button type="button" data-d="-1" data-k="${k(i)}" aria-label="한 팩 빼기">−</button>
        <input class="qty" data-qk="${k(i)}" inputmode="numeric" pattern="[0-9]*" value="${i.q}" aria-label="팩 수량"><span class="u">팩</span>
        <button type="button" data-d="1" data-k="${k(i)}" aria-label="한 팩 더하기">+</button></div>
        <button type="button" class="del" data-del="${k(i)}" aria-label="${esc(i.n)} 삭제">삭제</button></div></div>`).join('')||'<div><span>담은 상품이 없습니다</span><span></span></div>'}
    ${(w=>w?`<div class="warn" id="sumWarn" role="alert">${esc(w)}</div>`:'')(orderBlock(t))}
    <div><span>배송비</span><span>${t.ship?won(t.ship):'무료'}</span></div><div class="tot"><span>총 결제금액</span><span>${won(t.tot)}</span></div></div>
    ${t.items.length&&t.sub<CFG.freeShip?`<button type="button" class="more" data-close>＋ 상품 더 담으러 가기</button>`:''}
    ${s?`<div class="sug"><div class="pic">${charm(s)}</div><p><b>무료배송까지 ${won(CFG.freeShip-t.sub)} 남았습니다</b>${esc(s.n.split(' (')[0])} ${s.moq}팩 ${won(s.price*s.moq)}</p><button type="button" id="sugAdd" data-k="${esc(s.c)}">담기</button></div>`:''}`;
}
/* 주문 보내기를 막는 이유 (없으면 빈 글자): 담은 상품 없음 / 최소 주문금액 미달 / 옵션 합계 최소 팩 미달 */
function orderBlock(t){
  if(!t.items.length)return '담은 상품이 없습니다. 상품을 담아 주세요.';
  const s=P.filter(moqShort)[0];
  if(s)return `${s.n.split(' (')[0]}: ${moqMsg(s)}`;
  if(t.sub<CFG.minOrder)return `최소 주문금액 ${won(CFG.minOrder)}까지 ${won(CFG.minOrder-t.sub)} 더 담아 주세요.`;
  return '';
}

  const b=$('sugAdd');if(b)b.addEventListener('click',()=>{const p=byCode(b.dataset.k);cart[p.c]=p.moq;render();refreshSum();toast('담았습니다. 배송비가 무료로 바뀌었습니다')});
}

let looking=false;

    addr:[$('addr1').value.trim(),$('addr2').value.trim()].filter(Boolean).join(' '),memo:$('memo').value.trim(),items:cart,tax:$('taxReq').checked?$('taxInfo').value.trim():''};
  const err=$('err');
  const why=orderBlock(calc());if(why){err.textContent=why;return}
  if(looking){err.textContent='거래처 정보 확인 중입니다. 잠시 후 다시 눌러 주세요.';return}
  if(o.name.replace(/\s/g,'').length<2){err.textContent='이름(또는 가게 이름)을 적어주세요.';$('nm').focus();return}
  if(known&&pick===null){err.textContent='받으실 매장을 골라주세요.';$('stores').querySelector('input').focus();return}
  if(!o.shop){err.textContent='가게 이름을 적어주세요.';$('shopNm').focus();return}
  if(!o.useSavedTel&&o.tel.replace(/\D/g,'').length<9){err.textContent='연락처를 확인해 주세요.';$('tel2').focus();return}
  if(!$('agree').checked){err.textContent='개인정보 수집·이용에 동의해 주셔야 주문할 수 있습니다.';$('agree').focus();return}
  if($('taxReq').checked&&!o.tax){err.textContent='계산서·영수증 받으실 이메일 또는 사업자번호를 적어주세요.';$('taxInfo').focus();return}
  if(!o.same&&!$('addr1').value.trim()){err.textContent='배송 주소를 찾아주세요.';($('findAddr').hidden?$('addr1'):$('findAddr')).focus();return}
  if(!o.same&&$('addr1').readOnly&&!$('addr2').value.trim()){err.textContent='상세주소(층·호수 등)를 입력해 주세요. 없으면 "없음"이라고 적어주세요';$('addr2').focus();return}
  busy=true;$('send').disabled=true;$('send').textContent='주문 보내는 중…';err.textContent='';
  try{done(await api('submitOrder',o),o)}
  catch(x){
    const m=msgOf(x);err.textContent=m;$('send').disabled=false;$('send').textContent='다시 보내기';
    if(/주소/.test(m)){noSaved=true;$('addrBox').hidden=false}

  }finally{busy=false}
}
