<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>플레이브릿지 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 관리자 화면: 이동 중 휴대폰 한 손(엄지)으로 주문 진행 단계를 넘기는 화면. 주문 페이지(index.html)와 같은 색·글꼴 */
:root{color-scheme:light;--bg:#fffaf0;--card:#fff;--ink:#1d1a2b;--sub:#5d5872;--line:#ece4d2;--y:#ffd23f;--pk:#ff3d7f;--pk2:#ffe3ec;--ok:#0b7a4b;--soft:#f6f0ff;
  --s0:#8a6a00;--s0b:#fff3c4;--s1:#0b7a4b;--s1b:#dff5ea;--s2:#c2410c;--s2b:#ffe8d9;--s3:#1d63b8;--s3b:#dfeeff;--s4:#6d3fd6;--s4b:#ece4ff;--s5:#1d1a2b;--s5b:#e9e7ef;--cx:#777;--cxb:#eee}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere;overflow-x:clip;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
/* 로그인 */
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
#login .box{width:100%;max-width:360px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px 20px;text-align:center}
#login h1{margin:0 0 4px;font-size:22px;font-weight:900}
#login p{margin:0 0 16px;color:var(--sub);font-size:15px}
#pin{width:100%;min-height:56px;border:2px solid var(--ink);border-radius:14px;text-align:center;font-size:24px;font-weight:900;letter-spacing:.3em;background:#fff}
.big{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--pk);color:#fff;font-size:18px;font-weight:900;margin-top:12px}
.big:disabled{opacity:.5}
.err{color:#c0392b;font-weight:700;font-size:15px;min-height:1.5em;margin-top:8px}
/* 머리 (위에 고정) */
header{position:sticky;top:0;z-index:20;background:var(--y);padding:10px 16px 0;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{font-size:12px;font-weight:700;color:var(--sub)}
.ib{min-height:40px;padding:0 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:14px;font-weight:900;white-space:nowrap}
.sub{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:10px}
.sub button{min-height:44px;border:0;border-radius:12px 12px 0 0;background:rgba(255,255,255,.55);font-size:14px;font-weight:900;line-height:1.2;padding:4px 2px}
.sub button.on{background:var(--bg)}
.bar{background:var(--bg);margin:0 -16px;padding:10px 16px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 12px;border:2px solid var(--line);border-radius:999px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip b{min-width:22px;padding:0 6px;border-radius:99px;background:var(--soft);font-size:13px;text-align:center}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}.chip.on b{background:var(--pk);color:#fff}
.sbox{display:flex;gap:6px;margin-top:6px}
.sbox input{flex:1;min-height:46px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:16px}
.sbox button{flex:none}
main{padding:10px 16px}
.warnpin{margin:10px 16px 0;padding:10px 12px;border-radius:12px;background:var(--pk2);color:#a3123f;font-size:14px;font-weight:700}
/* 주문 카드 */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;margin:0 0 12px;overflow:hidden}
.card .hd{display:block;width:100%;border:0;background:none;text-align:left;padding:14px 14px 10px}
.row1{display:flex;align-items:flex-start;gap:8px}
.row1 .who{flex:1;font-size:18px;font-weight:900;line-height:1.35}
.row1 .who small{font-size:15px;font-weight:700;color:var(--sub)}
.badge{flex:none;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:900;white-space:nowrap}
.b0{background:var(--s0b);color:var(--s0)}.b1{background:var(--s1b);color:var(--s1)}.b2{background:var(--s2b);color:var(--s2)}.b3{background:var(--s3b);color:var(--s3)}.b4{background:var(--s4b);color:var(--s4)}.b5{background:var(--s5b);color:var(--s5)}.bx{background:var(--cxb);color:var(--cx)}
.po{font-size:13px;color:var(--sub);font-weight:700;margin-top:2px}
.sum{margin-top:6px;font-size:15px}
.sum b{font-size:17px;font-weight:900}
.req{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff3c4;border:1px solid #f1d36b;font-size:14px;font-weight:700}
.amemo{margin-top:6px;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amemo::before{content:'📝 '}
.inv{margin-top:6px;font-size:14px;font-weight:700;color:var(--ok)}
.next{display:flex;gap:6px;padding:0 14px 14px}
.next button{flex:1;min-height:56px;border:0;border-radius:14px;font-size:17px;font-weight:900;color:#fff}
.n0{background:var(--s1)}.n1{background:var(--s2)}.n2{background:var(--s3)}.n3{background:var(--s4)}.n4{background:var(--pk)}
.next button:disabled{opacity:.55}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fl{padding:2px 10px;border-radius:8px;font-size:13px;font-weight:900;white-space:nowrap}
.fl.red{background:#d92d20;color:#fff}.fl.warn{background:#fff1e6;color:#c2410c;border:1.5px solid #f59f6b}
.chk{display:flex;gap:10px;align-items:center;min-height:48px;margin-top:10px;padding:8px 10px;border-radius:12px;background:#fff0f0;font-weight:900;font-size:15px}
.chk input{width:24px;height:24px;flex:none;accent-color:#d92d20}
.hist{list-style:none;margin:0;padding:0;font-size:14px;color:var(--sub)}.hist li{padding:4px 0;border-bottom:1px dashed var(--line)}.hist li:first-child{color:var(--ink);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-weight:700}
/* 상세 창 */
#pane{position:fixed;inset:0;z-index:50;background:rgba(29,26,43,.45);display:flex;align-items:flex-end;justify-content:center}
#pane .sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overscroll-behavior:contain}
#pane .ph{display:flex;gap:8px;align-items:flex-start;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#pane .ph h2{flex:1;margin:0;font-size:19px;font-weight:900;line-height:1.35}
#pane .x{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--soft);font-size:24px;font-weight:900;line-height:1}
#pane .pb{overflow-y:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sec{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.sec h3{margin:0 0 8px;font-size:16px;font-weight:900}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stepper button{min-height:58px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:14px;font-weight:900;line-height:1.25;padding:4px}
.stepper button small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.stepper button.done{background:var(--soft)}
.stepper button.cur{border-color:var(--ink);background:var(--ink);color:#fff}.stepper button.cur small{color:#ddd}
.cxrow{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.cxbtn{min-height:44px;padding:0 14px;border:2px solid #d33;border-radius:12px;background:#fff;color:#c00;font-weight:900;font-size:15px}
.cxbox{margin-top:8px;padding:10px;border-radius:12px;background:#fff0f0}
.cxbox label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px}
.cxbox input{width:22px;height:22px}
textarea{width:100%;min-height:84px;border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-size:16px;resize:vertical}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.qchips button{min-height:38px;padding:0 10px;border:1px solid var(--line);border-radius:99px;background:var(--soft);font-size:14px;font-weight:700}
.btn{min-height:50px;padding:0 16px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-size:16px;font-weight:900}
.btn.w{width:100%}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.pk{background:var(--pk)}
.btn:disabled{opacity:.5}
.cour{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:8px}
.cour button{min-height:46px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:14px;font-weight:900;padding:0 2px}
.cour button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.f{width:100%;min-height:52px;border:2px solid var(--ink);border-radius:12px;padding:0 12px;background:#fff;font-size:18px;font-weight:700;letter-spacing:.02em}
.gap{display:grid;gap:8px;margin-top:8px}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.items li:last-child{border-bottom:0}
.items li b{flex:none;white-space:nowrap}
.op{display:block;color:var(--pk);font-weight:700;font-size:14px}
.ps{display:block;color:var(--sub);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:2px 0}
.kv.t{font-size:18px;font-weight:900;border-top:2px solid var(--ink);margin-top:6px;padding-top:6px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.contact a,.contact button{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;font-weight:900;text-decoration:none;font-size:16px}
.contact a{background:var(--ok);color:#fff}
.contact button{border:2px solid var(--ink);background:#fff}
.addr{font-size:15px;line-height:1.5}
/* 합계·피킹 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{min-height:48px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:900;font-size:14px;line-height:1.25}
.seg button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.agg{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.agg .t{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.agg .t span{font-weight:900;font-size:16px}
.agg .t b{flex:none;font-size:20px;font-weight:900;color:var(--pk);white-space:nowrap}
.agg .m{font-size:13px;color:var(--sub)}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:17px;padding:4px 2px 10px}
.pick li{align-items:center}
.pick label{display:flex;gap:10px;align-items:center;flex:1}
.pick input{width:24px;height:24px;flex:none}
.stk{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.stk>span{flex:1}.stk>b,.stk>a{flex:none;white-space:nowrap}
.out{color:#c00}
/* 알림 (위쪽) */
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:80;width:calc(100% - 24px);max-width:520px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast span{flex:1}
#toast button{flex:none;min-height:40px;padding:0 12px;border:0;border-radius:10px;background:var(--y);color:var(--ink);font-weight:900}
.spin{text-align:center;padding:30px;color:var(--sub);font-weight:700}
.rsdue{border:2px solid var(--ok)}.rsg{margin:8px 0 12px}.rsg>b{display:block;font-size:16px}
.rst{font-style:normal;font-size:12px;font-weight:800;padding:1px 6px;border-radius:6px;background:#eee;color:#666;white-space:nowrap}.rst.on{background:#e3f6ec;color:var(--ok)}
.seg4{grid-template-columns:repeat(4,1fr)}.seg4 button{min-height:42px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.kpi{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.kpi span{display:block;font-size:13px;font-weight:800;color:var(--sub)}.kpi b{display:block;font-size:22px;line-height:1.3}.kpi small{display:block;font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;height:150px;align-items:end;margin-top:8px}.bc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bc i{display:block;width:70%;min-height:2px;background:var(--pk);border-radius:6px 6px 0 0}.bc span{font-size:12px;font-weight:800;margin-top:4px}.bc small{font-size:11px;color:var(--sub)}
#adminStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 0}#adminStats[hidden]{display:none}
.ast{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}.ast span{display:block;font-size:13px;font-weight:800;color:var(--sub)}
.ast b{display:block;font-size:22px;line-height:1.3}.ast small{display:block;font-size:13px;color:var(--sub);overflow-wrap:anywhere}.ast.hot{border-color:var(--pk)}.ast.hot b{color:var(--pk)}
.seg3{grid-template-columns:repeat(3,1fr)}.seg3 button{font-size:13px;padding:0 2px}
.kmopen{min-height:44px;margin:4px 0 6px;font-size:16px}
.km h4{margin:16px 0 6px;font-size:16px}.km label.l{display:block;font-weight:800;font-size:14px;margin:8px 0 4px}
.km input[type=text],.km input[type=tel],.km input[type=number],.km select{width:100%;min-height:46px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:16px}
.km .cand{display:flex;gap:8px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px;margin:6px 0;font-size:14px;line-height:1.45}.km .cand.on{border-color:var(--pk);background:#fff0f5}
.km .cand b{font-size:15px}.km .cand .ps{display:block}
.km .it{display:grid;grid-template-columns:1fr 74px 40px;gap:6px;align-items:center;margin:6px 0}.km .it .op{grid-column:1/-1;display:flex;gap:6px}.km .it .op select{flex:1}
.km .it button{min-height:46px;border:0;border-radius:10px;background:#eee;font-weight:900}
.km .kmtot{display:flex;justify-content:space-between;font-weight:900;font-size:17px;margin:10px 0}.km .dup{border:2px solid #c00;border-radius:12px;padding:10px;margin:10px 0;background:#fff3f3;font-size:14px;line-height:1.5}
.km .dup.warn{border-color:#e08a00;background:#fff8ec}.km .dup b{display:block;font-size:15px;margin-bottom:4px}.km .prev{max-width:100%;max-height:220px;border-radius:10px;margin-top:6px;display:block}
.km textarea.rep{min-height:260px;font-size:14px;line-height:1.5}
.fl.card{background:#e8f0ff;color:#1f4fbf}.fl.kk{background:#fff7c2;color:#5c4a00}.fl.cp{background:#ffe8f0;color:#b0124b}
.sub button{font-size:13px}
.km .drop{border:2px dashed var(--line);border-radius:12px;padding:12px;text-align:center;font-size:14px;line-height:1.5;background:#fff}.km .drop.on{border-color:var(--pk);background:#fff0f5}.km .drop input{margin-top:8px;max-width:100%}
.km .kmchk,.kmchk{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-weight:700;font-size:15px;line-height:1.4}.kmchk input{width:22px;height:22px;flex:none}
.km .abadge{display:inline-block;background:#eaf6ee;color:#13723a;border-radius:99px;padding:0 8px;font-size:12px;font-weight:900}
.km .acmp{border:2px solid #e08a00;background:#fff8ec;border-radius:12px;padding:10px;margin:8px 0;font-size:14px;line-height:1.45}.km .acmp .ab{background:#fff;border-radius:8px;padding:6px 8px;margin:6px 0;word-break:keep-all}.km .acmp .ab span{display:block;font-size:12px;font-weight:900;color:var(--sub)}.km .acmp .ab.nw{border:2px solid #e08a00}
.km .am{display:flex;gap:8px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:8px;margin:6px 0;background:#fff}.km .am.on{border-color:var(--pk);background:#fff0f5}.km .am b{display:block}
.km .kmcp{display:flex;gap:6px}.km .kmcp input{flex:1;min-width:0;text-transform:uppercase}.km .kmcp .btn{flex:none;min-width:70px}
.km .dcard{background:#fff;border-radius:10px;padding:8px;margin:6px 0;line-height:1.45}.km .dcard .why{color:#c00;font-weight:800}.km .dcard.new{border:2px dashed var(--line)}
.proof{margin-top:10px}.proof a{display:block;text-decoration:none;font-weight:800}.proof img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:6px}
.cpform label{display:block;font-weight:800;font-size:14px;margin:8px 0 0}.cpform input:not([type=checkbox]){display:block;width:100%;min-height:46px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;margin-top:4px;background:#fff}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cpc{background:#fff;border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}.cpc.off{opacity:.6}.cpc .row1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cpc .tg{flex:none;min-height:40px;border:0;border-radius:99px;padding:0 14px;font-weight:900;background:#eee}.cpc .tg.on{background:#13723a;color:#fff}
.lnk{border:0;background:none;color:#1f4fbf;font-weight:800;text-decoration:underline;padding:4px 0;font-size:14px;min-height:32px}
.sec.master{border:2px solid var(--line)}.sec.master h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tb2 .xlopen{grid-column:1/-1}.tb2 .kmopen{font-size:15px;padding:0 6px}
.dp .dpt{display:grid;gap:6px}.dp .dpr{display:grid;grid-template-columns:92px 1fr 88px 36px;gap:4px}.dp .dpr input{min-height:44px;border:2px solid var(--line);border-radius:10px;padding:0 6px;font-size:15px;min-width:0;background:#fff}.dp .dpr button{border:0;border-radius:10px;background:#eee;font-weight:900}
.dp .dpm{border:2px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fff}.dp .dpm.EXACT{border-color:#1a9b4b}.dp .dpm.AMOUNT_ONLY,.dp .dpm.MULTI{border-color:#e0a000}.dp .dpm.UNMATCHED{opacity:.7;border-color:#e57373}
.dp .dh{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}.dp .dbg{font-size:13px;font-weight:900;white-space:nowrap}.dp select{width:100%;min-height:44px;margin-top:6px;border:2px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h1>플레이브릿지 관리</h1>
    <p>주문 진행 관리 · 관리자 전용</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" aria-label="관리자 비밀번호">
    <div class="err" id="lErr" role="alert"></div>
    <button class="big" id="lGo" type="button">들어가기</button>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="top"><h1>주문 관리 <small id="upd"></small></h1><button class="ib" id="reload" type="button">새로고침</button><button class="ib" id="out" type="button">나가기</button></div>
    <div class="sub" role="tablist">
      <button type="button" data-tab="ord" class="on">주문<br>진행관리</button>
      <button type="button" data-tab="agg">1688발주·<br>품목합계</button>
      <button type="button" data-tab="stk">재고·<br>입고알림</button>
      <button type="button" data-tab="sta">📊<br>간단 통계</button>
      <button type="button" data-tab="cpn">🎟<br>할인 코드</button>
    </div>
    <div class="bar" id="ordBar">
      <div class="tb2"><button class="btn w pk kmopen" type="button" id="kmOpen">＋ 카톡 주문 등록</button><button class="btn w kmopen" type="button" id="dpOpen">📸 입금내역 캡처 매칭</button><button class="btn w kmopen xlopen" type="button" id="xlOpen">📊 은행 입금내역(엑셀/CSV) 일괄 확인</button></div>
      <div class="chips" id="chips"></div>
      <div class="sbox"><input id="q" type="search" placeholder="거래처·주문자·뒷자리·발주번호" aria-label="주문 검색"></div>
    </div>
  </header>
  <div class="warnpin" id="weak" hidden>관리자 비밀번호가 짧습니다. 시트 '설정' 탭의 '관리자비밀번호'를 8자리 이상으로 바꿔 주세요.</div>
  <section id="adminStats" aria-label="주문 요약" hidden></section>
  <main id="main"><div class="spin">불러오는 중…</div></main>
</div>

<div id="pane" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pT"><div class="ph"><h2 id="pT"></h2><button class="x" type="button" id="pX" aria-label="닫기">×</button></div><div class="pb" id="pB"></div></div></div>
<div id="toast" hidden role="status"><span id="tMsg"></span><button type="button" id="tUndo" hidden>되돌리기</button></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbwyEpDKKX4pif4FgYtxrepxrqzmCJDM4NmHcb29SrzkMXCPEHMVAwYxdtpEuCwtFCGxyw/exec';
const STAGES=['입금대기','입금확인(발주전)','1688발주완료','중국배송출발','한국도착(통관)','국내발송완료'],CANCEL='취소';
const NEXT_LABEL=['입금 확인 완료','1688 발주 체크','중국배송 출발 체크','한국 도착 체크','국내 송장 입력'];
const COURIERS=['로젠','한진','CJ대한통운','우체국'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const sIdx=s=>s===CANCEL?-1:STAGES.indexOf(s);
const bCls=s=>s===CANCEL?'bx':'b'+Math.max(0,STAGES.indexOf(s));
const store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
const SHOW_STATS=false;   /* 통계 숨김 (2026-11-24 요청자 '잠시 안 보이게'): '📊 간단 통계' 탭 + 주문 탭 위 요약 4칸. 다시 보이게 하려면 true */
let PIN=store.get('pb_admin')||'',S={orders:[],counts:{}},F='전체',Q='',TAB='ord',AGG='buy',STK=null,openPo='',STP='7d';

/* 서버 호출 (text/plain → 사전요청 없이 Apps Script doPost) */
function call(action,payload){
  return fetch(API_URL,{method:'POST',body:JSON.stringify({action,payload:Object.assign({pin:PIN},payload||{})}),redirect:'follow'})
    .then(r=>{if(!r.ok)throw new Error('서버 연결이 원활하지 않습니다. 잠시 후 다시 시도해 주세요.');return r.json()})
    .then(j=>{if(!j||!j.ok){const m=(j&&j.error)||'처리하지 못했습니다.';if(/비밀번호/.test(m)&&action!=='adminLogin')logout(m);throw new Error(m)}return j.data});
}
let tT=0;
function toast(msg,undo){$('tMsg').textContent=msg;const u=$('tUndo');u.hidden=!undo;u.onclick=()=>{$('toast').hidden=true;undo&&undo()};$('toast').hidden=false;clearTimeout(tT);tT=setTimeout(()=>$('toast').hidden=true,undo?7000:3000)}
function copy(t,msg){const ok=()=>toast(msg||'복사되었습니다');if(navigator.clipboard&&isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>fb());else fb();
  function fb(){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('복사하지 못했습니다')}a.remove()}}

/* ---------- 로그인 ---------- */
async function login(){
  const p=$('pin').value.trim();if(!p){$('lErr').textContent='비밀번호를 적어주세요.';return}
  $('lGo').disabled=true;$('lErr').textContent='';PIN=p;
  try{const r=await call('adminLogin',{});store.set('pb_admin',p);start(r)}
  catch(e){PIN='';$('lErr').textContent=e.message}finally{$('lGo').disabled=false}
}
function logout(msg){PIN='';store.set('pb_admin',null);$('app').hidden=true;$('login').hidden=false;closePane();$('pin').value='';if(msg)$('lErr').textContent=msg}
function start(r){$('login').hidden=true;$('app').hidden=false;$('weak').hidden=!(r&&r.weakPin);load()}

/* ---------- 데이터 ---------- */
async function load(){
  $('reload').disabled=true;
  try{const r=await call('adminSummary',{});S=r;$('upd').textContent=r.at+' 기준';render();if(openPo)detail(openPo)}
  catch(e){if(PIN)$('main').innerHTML=`<div class="empty">${esc(e.message)}<br><br><button class="btn" type="button" onclick="load()">다시 불러오기</button></div>`}
  finally{$('reload').disabled=false}
}
function recount(){const c={전체:S.orders.length};STAGES.concat(CANCEL).forEach(s=>c[s]=0);S.orders.forEach(o=>c[o.status]=(c[o.status]||0)+1);S.counts=c}
function putOrder(o){const i=S.orders.findIndex(x=>x.po===o.po);if(i>=0)S.orders[i]=o;else S.orders.unshift(o);recount()}

/* 품명: '[캐릭터] 이름 (구성) [옵션]' → 이름 / 옵션 / 구성 */
function nm(n){const t=String(n||''),pre=(t.match(/^\s*\[[^\]]*\]\s*/)||[''])[0],r=t.slice(pre.length),op=(r.match(/\[[^\]]*\]/g)||[]).map(x=>x.slice(1,-1)),pa=(r.replace(/\[[^\]]*\]/g,'').match(/\([^)]*\)/g)||[]),main=r.replace(/\[[^\]]*\]|\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();return{main:(pre.trim()+' '+main).trim(),short:main||t,op:op.join(' · '),pa:pa.join(' ')}}
function packOf(u){return Number((String(u).match(/(\d+)\s*(?:EA|개|입|pcs)/i)||[])[1])||1}

/* ---------- 주문별 진행관리 ---------- */
function chips(){const L=['전체'].concat(STAGES,CANCEL);$('chips').innerHTML=L.map(s=>`<button type="button" class="chip${s===F?' on':''}" data-f="${esc(s)}">${esc(s)}<b>${S.counts[s]||0}</b></button>`).join('')}
function match(o){if(F!=='전체'&&o.status!==F)return false;if(!Q)return true;const q=Q.replace(/\s/g,'').toLowerCase();return [o.shop,o.who,o.po,o.tel.replace(/\D/g,'').slice(-4),o.tel.replace(/\D/g,'')].some(x=>String(x).replace(/\s/g,'').toLowerCase().includes(q))}
/* 주문일로부터 며칠 지났는지 (한국 날짜 기준) */
const kday=t=>Math.floor((t+9*3600e3)/864e5);
function unpaidDays(o){return o.status===STAGES[0]&&o.ts?kday(Date.now())-kday(o.ts):0}
function card(o){
  const i=sIdx(o.status),first=nm((o.items[0]||{}).n),dn=unpaidDays(o);
  const flags=(o.card?`<span class="fl card">💳 법인카드 요청${o.payLink?' · 링크 저장됨':''}</span>`:'')+(o.route==='카톡'?'<span class="fl kk">💬 카톡</span>':'')+(o.coupon?`<span class="fl cp">🎟 ${esc(o.coupon)}</span>`:'')+(o.pgType==='PG_CARD'?`<span class="fl card">카드PG · ${esc(o.pgStatus||'')}</span>`:'')+(o.partial?'<span class="fl red">부분발송</span>':'')+(dn>=2&&!o.card?`<span class="fl warn">미입금 D+${dn}일</span>`:'');
  const nextBtn=i>=0&&i<5?`<div class="next"><button type="button" class="n${i}" data-next="${esc(o.po)}">${NEXT_LABEL[i]}</button></div>`:'';
  return `<article class="card" id="c-${esc(o.po)}">
    <button type="button" class="hd" data-open="${esc(o.po)}" aria-label="${esc(o.shop)} 주문 자세히 보기">
      ${flags?`<div class="flags">${flags}</div>`:''}
      <div class="row1"><div class="who">${esc(o.shop||'-')} <small>(${esc(o.who||'-')})</small></div><span class="badge ${bCls(o.status)}">${esc(o.status)}</span></div>
      <div class="po">${esc(o.po)} · ${esc(o.date)}${o.changedAt?` · 변경 ${esc(o.changedAt)}`:''}</div>
      <div class="sum">${esc(first.short)}${o.items.length>1?` 외 ${o.items.length-1}종`:''} · 총 ${o.packs}팩 · <b>${won(o.total)}</b></div>
      ${o.memo?`<div class="req">${esc(o.memo)}</div>`:''}
      ${o.adminMemo?`<div class="amemo">${esc(o.adminMemo.split('\n').filter(Boolean).pop())}</div>`:''}
      ${o.invoice?`<div class="inv">🚚 ${esc(o.courier)} ${esc(o.invoice)}</div>`:''}
    </button>${nextBtn}</article>`;
}
function renderOrders(){
  chips();
  const L=S.orders.filter(match);
  $('main').innerHTML=L.length?L.map(card).join(''):`<div class="empty">${Q?'검색 결과가 없습니다':esc(F)+' 주문이 없습니다'}</div>`;
}

/* 단계 바꾸기 (되돌리기 지원) */
async function setStage(po,status,extra,btn){
  const o=S.orders.find(x=>x.po===po);if(!o)return;
  const prev=o.status;if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='저장 중…'}
  try{
    const r=await call('adminUpdateStatus',Object.assign({po,status},extra||{}));putOrder(r.order);render();if(openPo===po)detail(po);
    const back=r.prev;
    toast(`${o.shop} → ${r.order.status}${r.restored&&r.restored.length?' · 재고 '+r.restored.map(x=>`${x.c} ${x.from}→${x.to}`).join(', '):''}`,
      back!==r.order.status&&r.order.status!==STAGES[5]?()=>setStage(po,back,(extra&&extra.restoreStock)?{restoreStock:true}:{}):null);
  }catch(e){toast(e.message);if(btn){btn.disabled=false;btn.textContent=btn.dataset.t}}
}

/* ---------- 상세 창 ---------- */
let scrollY0=0;
function openPane(){if($('pane').hidden){scrollY0=scrollY;document.body.classList.add('lock')}$('pane').hidden=false}
function closePane(){if($('pane').hidden)return;$('pane').hidden=true;openPo='';document.body.classList.remove('lock');scrollTo(0,scrollY0)}
function detail(po,focusInv){
  const o=S.orders.find(x=>x.po===po);if(!o)return closePane();
  openPo=po;const i=sIdx(o.status);let cour=o.courier||'';
  $('pT').innerHTML=`${esc(o.shop)} <small style="font-size:15px;color:var(--sub)">(${esc(o.who)})</small><div class="po">${esc(o.po)} · ${esc(o.date)} <span class="badge ${bCls(o.status)}">${esc(o.status)}</span></div>`;
  $('pB').innerHTML=`
  <div class="sec"><h3>진행 단계 <small style="font-weight:700;color:var(--sub);font-size:13px">눌러서 바로 변경</small></h3>
    <div class="stepper">${STAGES.map((s,k)=>`<button type="button" data-st="${k}" class="${k===i?'cur':k<i?'done':''}">${k+1}. ${esc(s.replace('(','​('))}<small>${k===i?'현재':k<i?'완료':''}</small></button>`).join('')}</div>
    <div class="cxrow">${o.status===CANCEL?`<button class="btn ghost" type="button" id="unCx">취소 되돌리기 (입금대기로)</button>`:`<button class="cxbtn" type="button" id="cx">주문 취소</button>`}</div>
    <div class="cxbox" id="cxBox" hidden><label><input type="checkbox" id="rst" checked> 재고 칸(숫자)도 ${o.status===CANCEL?'다시 차감':'되돌리기'}</label><button class="btn w" type="button" id="cxGo" style="margin-top:8px;background:#c00">${o.status===CANCEL?'되돌리기 확정':'취소 확정'}</button></div>
  </div>
  ${o.memo?`<div class="req" style="margin:0 0 12px">요청사항: ${esc(o.memo)}</div>`:''}
  <div class="sec"><h3>${o.card?'💳 법인카드 결제링크 · 안내문':'입금 안내문'}</h3>
    ${o.card?`<input class="f" id="plink" type="url" inputmode="url" autocomplete="off" placeholder="https:// 카드 결제링크 붙여넣기" value="${esc(o.payLink||'')}" aria-label="카드 결제링크">
      <button class="btn w" type="button" id="plGo" style="margin-top:8px">결제링크 저장</button>`:''}
    <button class="btn w pk" type="button" id="repCp" style="margin-top:8px">${o.card?'결제링크 포함 카톡 안내문 복사':'카톡 입금 안내문 다시 복사'}</button>
    <button class="btn w ghost" type="button" id="ntfGo" style="margin-top:8px">📧 주문 알림 메일 다시 보내기</button>
    ${o.proof?`<div class="proof"><a href="${esc(o.proof)}" target="_blank" rel="noopener">${(m=>m?`<img src="https:\/\/lh3.googleusercontent.com/d/${m[1]}=w600" alt="카톡 증빙 사진" onerror="this.remove()">`:'')(o.proof.match(/\/d\/([\w-]{20,})/))}<span>📎 카톡 증빙 사진 열기</span></a></div>`:''}
  </div>
  <div class="sec"><h3>관리메모 <small style="font-weight:700;color:var(--sub);font-size:13px">1688 주문번호·배대지 등</small></h3>
    <div class="qchips">${['1688 주문번호: ','배대지 입고완료','배대지 송장: ','일부 품목 내일 출고'].map(q=>`<button type="button" data-q="${esc(q)}">${esc(q.replace(/: $/,''))}</button>`).join('')}</div>
    <textarea id="am" placeholder="메모를 적고 저장을 누르세요">${esc(o.adminMemo)}</textarea>
    <button class="btn w" type="button" id="amGo" style="margin-top:8px">메모 저장</button>
  </div>
  <div class="sec"><h3>국내 발송 (택배사·송장)</h3>
    <div class="cour">${COURIERS.map(c=>`<button type="button" data-c="${esc(c)}" class="${c===cour?'on':''}">${esc(c)}</button>`).join('')}</div>
    <input class="f" id="inv" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" placeholder="송장번호 (숫자)" value="${esc(o.invoice)}" aria-label="송장번호">
    <div class="gap"><button class="btn w pk" type="button" id="invGo">송장 저장 (국내발송완료)</button>
    ${o.invoice?`<button class="btn w ghost" type="button" id="kakao">사장님 발송안내 카톡 멘트 복사</button>`:''}</div>
    <label class="chk"><input type="checkbox" id="part" ${o.partial?'checked':''}> 부분 발송 (미발송 잔여 품목 있음)</label>
  </div>
  <div class="sec"><h3>품목 ${o.items.length}종 · ${o.packs}팩</h3><ul class="items">${o.items.map(t=>{const x=nm(t.n);return `<li><span>${esc(x.main)}${x.op?`<span class="op">${esc(x.op)}</span>`:''}${x.pa?`<span class="ps">${esc(x.pa)} · ${esc(t.unit)}</span>`:''}</span><b>${t.q}팩<br><small style="font-weight:700">${won(t.sum)}</small></b></li>`}).join('')}</ul>
    <div class="kv"><span>상품</span><span>${won(o.sub)}</span></div>${o.depName||o.depAt?`<div class="kv"><span>입금확인</span><span>${esc(o.depName||'')}${o.depAt?' · '+esc(o.depAt):''}</span></div>`:''}${o.pgType==='PG_CARD'?`<div class="kv"><span>결제수단</span><span>카드PG · ${esc(o.pgStatus||'')}${o.receipt?` · <a href="${esc(o.receipt)}" target="_blank" rel="noopener">매출전표</a>`:''}</span></div>`:''}${o.disc?`<div class="kv" style="color:#c00"><span>할인 ${esc(o.coupon)}</span><span>-${won(o.disc)}</span></div>`:''}<div class="kv"><span>배송비</span><span>${o.ship?won(o.ship):'무료'}</span></div><div class="kv t"><span>합계</span><span>${won(o.total)}</span></div></div>
  ${(o.history||[]).length?`<div class="sec"><h3>변경 이력</h3><ul class="hist">${o.history.slice().reverse().map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div>`:''}
  <div class="sec"><h3>배송지 · 연락처</h3><div class="addr">${esc(o.addr||'-')}</div><div class="addr" style="margin-top:4px;font-weight:700">${esc(o.tel)}</div>
    <div class="contact"><a href="tel:${esc(o.tel.replace(/[^0-9+]/g,''))}">📞 전화 걸기</a><button type="button" id="addrCp">주소 복사</button></div></div>`;
  openPane();
  const B=$('pB');
  B.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>{const k=+b.dataset.st;if(k===i)return;
    if(k===5&&!$('inv').value.trim()){toast('송장번호를 먼저 적어 주세요');$('inv').focus();return}
    if(k===5&&!cour){toast('택배사를 골라 주세요');return}
    setStage(po,STAGES[k],k===5?{courier:cour,invoice:$('inv').value.trim()}:{},b)}));
  const cx=$('cx')||$('unCx');cx.addEventListener('click',()=>{$('cxBox').hidden=!$('cxBox').hidden});
  $('cxGo').addEventListener('click',e=>setStage(po,o.status===CANCEL?STAGES[0]:CANCEL,{restoreStock:$('rst').checked},e.target));
  B.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{const a=$('am');a.value=(a.value.trim()?a.value.replace(/\s+$/,'')+'\n':'')+b.dataset.q;a.focus();a.setSelectionRange(a.value.length,a.value.length)}));
  $('amGo').addEventListener('click',async e=>{const b=e.target;b.disabled=true;b.textContent='저장 중…';
    try{const r=await call('adminUpdateStatus',{po,adminMemo:$('am').value});putOrder(r.order);render();toast('메모를 저장했습니다');detail(po)}catch(x){toast(x.message);b.disabled=false;b.textContent='메모 저장'}});
  B.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{cour=b.dataset.c;B.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))}));
  $('invGo').addEventListener('click',e=>{const v=$('inv').value.trim();if(!cour){toast('택배사를 골라 주세요');return}if(!v){toast('송장번호를 적어 주세요');$('inv').focus();return}setStage(po,STAGES[5],{courier:cour,invoice:v},e.target)});
  $('part').addEventListener('change',async e=>{const c=e.target,v=c.checked;c.disabled=true;
    try{const r=await call('adminUpdateStatus',{po,partial:v});putOrder(r.order);render();toast(v?'부분발송으로 표시했습니다':'부분발송 표시를 껐습니다')}catch(x){c.checked=!v;toast(x.message)}finally{c.disabled=false}});
  if($('kakao'))$('kakao').addEventListener('click',()=>copy(shipMsg(o),'발송안내 멘트를 복사했습니다. 카톡에 붙여넣어 주세요'));

/* ---------- 카톡 주문 등록 ---------- */
let KM=null;   // {P:상품목록, CFG, img, rows, match}
async function kmProducts(){if(KM&&KM.P)return;const r=await fetch(API_URL+'?action=bootstrap',{redirect:'follow'}).then(r=>r.json());if(!r||!r.ok)throw new Error('상품 목록을 불러오지 못했습니다');KM.P=r.data.products.filter(p=>p.tag!=='out');KM.CFG=r.data.cfg}
const kmShort=n=>String(n).split(' (')[0];
const KM_STOP=['키링','봉제','혼합','인형','세트','피규어','파우치','종','cm','팩','개','산리오','치이카와','짱구'];
/* 카톡 글에서 상품·수량 짐작 (관리자가 고쳐서 확정) */
function kmGuess(text){
  const out={},lines=String(text||'').split(/\n|,|\//).map(x=>x.trim()).filter(Boolean),nz=t=>t.replace(/\s+/g,'').toLowerCase();
  lines.forEach(line=>{const L=nz(line);let best=null,bs=0;
    KM.P.forEach(p=>{const words=kmShort(p.n).replace(/[\[\]()·,]/g,' ').split(/\s+/).filter(w=>w.length>=2&&!KM_STOP.some(s=>w===s||/^\d+(종|cm|개)$/.test(w)));
      const sc=words.filter(w=>L.indexOf(nz(w))>=0).length;if(sc>bs){bs=sc;best=p}});
    if(!best)return;const m=line.match(/(\d+)\s*(팩|세트|p|P|박스)/)||line.match(/(\d+)\s*개/);let q=m?parseInt(m[1],10):best.moq;
    if(m&&/개/.test(m[0])&&best.pack>1)q=Math.max(best.moq,Math.ceil(q/best.pack));
    const k=best.c;out[k]=(out[k]||0)+q});
  return Object.keys(out).map(c=>({c,q:out[c],o1:'',o2:''}));

const DP_SKIP=/^(입금|출금|이체|타행|당행|모바일|스마트|인터넷|입금내역|거래내역|잔액|원|월|일|신한|국민|우리|하나|농협|기업|카카오뱅크|카카오|토스|토스뱅크|케이뱅크|새마을|우체국|SC제일|씨티|부산|대구|경남|광주|전북|제주|수협|신협|web발신|웹발신|알림|안내|체크|카드|ATM|CD|오픈뱅킹|펌뱅킹|급여|자동|입금자|받는분|보낸분|메모|내용|구분|거래|금액|일시|날짜|전체|조회|기간|오늘|어제|더보기|확인|통장|계좌|예금|주식회사)$/i;
/* 입금 알림 문자·은행 앱 캡처 글자 → [{date,name,amount}] (출금·잔액은 뺌, 이름·금액이 다른 줄이면 가까운 줄끼리 묶음) */
function dpParse(text){
  const L=String(text||'').replace(/\r/g,'').split('\n').map(x=>x.replace(/잔액\s*[:：]?\s*[\d,]+\s*원?/g,' ').trim()).filter(Boolean),out=[];
  const amtOf=l=>{if(/출금|지출|결제|-\s*[\d,]{4,}/.test(l)&&!/입금|\+/.test(l))return 0;const m=l.match(/\+?\s*(\d{1,3}(?:,\d{3})+|\d{4,9})\s*원?/g);if(!m)return 0;
    const v=m.map(x=>Number(x.replace(/[^\d]/g,''))).filter(n=>n>=1000&&n<100000000&&!/^(19|20)\d{6}$/.test(String(n)));return v.length?v[0]:0};
  const dateOf=l=>{const m=l.match(/(\d{1,2})[./-](\d{1,2})(?:[./-]\d{2,4})?\s*(\d{1,2}:\d{2})?/)||l.match(/(\d{1,2})월\s*(\d{1,2})일\s*(\d{1,2}:\d{2})?/);return m?(m[1]+'/'+m[2]+(m[3]?' '+m[3]:'')):''};
  const nameOf=l=>{const w=l.replace(/[\d,:./+\-()\[\]*]+/g,' ').replace(/원\b/g,' ').split(/\s+/).map(x=>x.trim()).filter(x=>x.length>=2&&x.length<=14&&/[가-힣A-Za-z]/.test(x)&&!DP_SKIP.test(x));return w.length?w[w.length-1]:''};
  for(let i=0;i<L.length;i++){
    const l=L[i],a=amtOf(l);if(!a)continue;
    let n=nameOf(l),d=dateOf(l);
    for(let k=1;k<=2&&(!n||!d);k++){if(!n&&L[i-k]&&!amtOf(L[i-k]))n=nameOf(L[i-k]);if(!d&&L[i-k])d=dateOf(L[i-k]);if(!n&&L[i+k]&&!amtOf(L[i+k]))n=nameOf(L[i+k]);if(!d&&L[i+k])d=dateOf(L[i+k])}
    out.push({date:d,name:n,amount:a});
  }
  return out;
}

let TESS=null;
function dpTess(){if(window.Tesseract)return Promise.resolve();if(TESS)return TESS;TESS=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>{TESS=null;no(new Error('글자 읽기 도구를 불러오지 못했어요. 입금 문자를 붙여넣거나 표에 직접 적어 주세요'))};document.head.appendChild(s)});return TESS}
async function dpOcr(files){
  files=(files||[]).filter(Boolean);if(!files.length)return;
  const box=$('dpOcr');
  try{box.textContent='글자 읽기 도구 준비 중… (처음 한 번은 10~30초)';await dpTess();
    for(let i=0;i<files.length;i++){box.textContent=`캡처 ${i+1}/${files.length} 글자 읽는 중…`;
      const r=await Tesseract.recognize(files[i],'kor+eng',{logger:m=>{if(m.status==='recognizing text')box.textContent=`캡처 ${i+1}/${files.length} 읽는 중 ${Math.round(m.progress*100)}%`}});
      const t=(r&&r.data&&r.data.text)||'';$('dpText').value=($('dpText').value?$('dpText').value+'\n':'')+t;
      const got=dpParse(t);DP.rows=DP.rows.concat(got);dpRowsRender();box.textContent=`캡처 ${i+1}장 읽기 완료 · 입금 ${got.length}건 찾음 (틀린 곳은 표에서 고쳐 주세요)`}
  }catch(e){box.textContent='❌ '+e.message}
}

    el.querySelector('[data-x]').onclick=()=>{DP.rows.splice(+el.dataset.i,1);dpRowsRender();DP.res=null;$('dpRes').innerHTML=''}});
}
const DP_BADGE={EXACT:'🟢 자동 매칭',MULTI:'🟡 복수 후보 확인 필요',AMOUNT_ONLY:'🟡 금액만 일치',UNMATCHED:'🔴 매칭 없음'};
async function dpMatch(){
  const items=DP.rows.filter(r=>r.amount>0);if(!items.length){toast('입금액이 있는 입금 건을 넣어 주세요');return}
  const b=$('dpMatch');b.disabled=true;b.textContent='매칭 중…';
  try{const r=await call('matchDeposits',{items});DP.res=r.results;DP.items=items;dpResRender(r.waiting)}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='입금대기 주문과 다시 매칭'}
}

  </div>`).join('')}

async function dpConfirm(){
  const pick=[];let bad='';
  $('dpRes').querySelectorAll('.dpm').forEach(el=>{const r=DP.res[+el.dataset.i];if(!el.querySelector('[data-ck]').checked)return;if(!r.pick){bad=`${r.name||'이름 없음'} ${won(r.amount)}: 주문을 골라 주세요`;return}pick.push({po:r.pick,name:r.name,date:r.date})});
  if(bad){$('dpErr').textContent=bad;return}if(!pick.length){$('dpErr').textContent='체크된 입금 건이 없어요';return}
  const dup=pick.map(p=>p.po).filter((p,i,a)=>a.indexOf(p)!==i);if(dup.length){$('dpErr').textContent='같은 주문이 두 번 선택됐어요: '+dup.join(', ');return}
  if(!confirm(`${pick.length}건을 입금확인(발주전)으로 바꿀까요?\n\n`+pick.map(p=>`${p.po} ← ${p.name}`).join('\n')))return;
  const b=$('dpGo');b.disabled=true;b.textContent='처리 중…';
  try{const r=await call('confirmMatchedDeposits',{list:pick});
    toast(`입금확인 ${r.done.length}건 완료${r.skipped.length?` · 건너뜀 ${r.skipped.length}건`:''}`);
    $('dpRes').innerHTML=`<p class="ok" style="font-weight:900;font-size:17px">✅ 입금확인 ${r.done.length}건 완료</p>${r.done.map(p=>`<div class="ps">${esc(p)} → 입금확인(발주전)</div>`).join('')}${r.skipped.map(s=>`<div class="ps" style="color:#c00">${esc(s.po)} 건너뜀: ${esc(s.reason)}</div>`).join('')}`;
    load();
  }catch(e){$('dpErr').textContent=e.message;b.disabled=false;b.textContent='선택 건 일괄 입금확인 처리'}
}

/* ---------- 📊 은행 입금내역(엑셀/CSV) 일괄 확인 ---------- */
/* 은행 엑셀·CSV의 표(2차원 배열) → 입금 건 [{date,name,amount}]. 위쪽 계좌 요약 줄은 건너뛰고 머리글 줄을 찾아 열을 자동 인식 (기업·국민·신한·우리·하나·농협·카카오뱅크·토스뱅크 등) */
const XL_H={date:/거래일시|입금일시|거래일자|거래일|거래시간|일시|날짜/,inAmt:/입금액|맡기신\s*금액|입금\s*금액|입금\(원\)|^입금$|받은\s*금액/,outAmt:/출금액|찾으신\s*금액|^출금$|출금\s*금액/,amt:/거래금액|^금액$|금액\(원\)/,type:/구분|입출금|거래구분|거래종류|거래유형|^유형$/,
  name:[/입금자명|^입금자$/,/보낸\s*분|보내는\s*분|받는분\/보낸분|의뢰인|상대방|송금인/,/기재내용|거래내용/,/적요/,/내용|메모/]};
function xlRows(aoa){
  const clean=v=>String(v==null?'':v).replace(/\s+/g,' ').trim(),num=v=>{const s=String(v==null?'':v).replace(/[,원\s]/g,'');return /^[+-]?\d+(\.\d+)?$/.test(s)?Number(s):0};
  let h=-1,col={};
  for(let i=0;i<Math.min(aoa.length,40)&&h<0;i++){const r=(aoa[i]||[]).map(clean),f=re=>r.findIndex(c=>c&&re.test(c.replace(/\s/g,'')));   /* '거래 금액'·'거래 유형'처럼 띄어 쓴 머리글도 */
    const c={date:f(XL_H.date),inAmt:f(XL_H.inAmt),outAmt:f(XL_H.outAmt),amt:f(XL_H.amt),type:f(XL_H.type),name:-1};
    for(const re of XL_H.name){const k=f(re);if(k>=0&&k!==c.date&&k!==c.inAmt&&k!==c.type){c.name=k;break}}
    if((c.inAmt>=0||c.amt>=0)&&(c.name>=0||c.date>=0)){h=i;col=c}}
  if(h<0)throw new Error('머리글(입금액·기재내용 등)을 찾지 못했어요. 은행에서 받은 거래내역 파일인지 확인해 주세요');
  const out=[];
  for(let i=h+1;i<aoa.length;i++){const r=aoa[i]||[];
    let a=col.inAmt>=0?num(r[col.inAmt]):0;
    if(col.inAmt<0&&col.amt>=0){const v=num(r[col.amt]);a=col.type>=0?(/입금|\+/.test(clean(r[col.type]))?Math.abs(v):0):(v>0?v:0)}   /* 금액 한 칸: 구분이 입금이거나, 구분 칸이 없으면 +금액만 */
    if(!(a>0))continue;
    const name=col.name>=0?clean(r[col.name]):'',date=col.date>=0?clean(r[col.date]):'';
    if(r.some(c=>/^(합계|총계|소계|누계|합\s*계)/.test(clean(c))))continue;   /* 맨 아래 합계 줄 빼기 (어느 칸에 있든) */
    out.push({date:date.slice(0,20),name:name.slice(0,40),amount:Math.round(a)});
  }
  return out;
}
let XLS=null;
function xlLib(){if(window.XLSX)return Promise.resolve();if(XLS)return XLS;XLS=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>{XLS=null;no(new Error('엑셀 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요'))};document.head.appendChild(s)});return XLS}
async function xlRead(file){
  await xlLib();
  const buf=await file.arrayBuffer();let wb;
  if(/\.csv$|\.txt$/i.test(file.name)||/csv|text/.test(file.type)){
    let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){text=new TextDecoder('euc-kr').decode(buf)}   /* 국내 은행 CSV는 EUC-KR이 많음 */
    wb=XLSX.read(text.replace(/^﻿/,''),{type:'string',raw:true});
  }else wb=XLSX.read(new Uint8Array(buf),{type:'array'});
  let best=[];for(const n of wb.SheetNames){try{const r=xlRows(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}));if(r.length>best.length)best=r}catch(e){if(wb.SheetNames.length===1)throw e}}
  return best;
}
function xlPane(){
  DP={rows:[],res:null};openPo='';
  $('pT').textContent='📊 은행 입금내역 일괄 확인';
  $('pB').innerHTML=`<div class="km dp">
    <p class="ps">인터넷뱅킹에서 받은 <b>거래내역 엑셀(.xlsx·.xls) 또는 CSV</b>를 올리세요. 입금 건만 골라 입금대기 주문과 맞춰 봅니다.</p>
    <div class="drop" id="xlDrop" tabindex="0"><b>📂 파일을 끌어다 놓거나 아래에서 고르기</b><span class="ps">기업·국민·신한·우리·하나·농협·카카오뱅크·토스뱅크 등</span><input type="file" id="xlFile" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple></div>
    <div class="ps" id="xlMsg"></div>

    <button class="btn w pk" type="button" id="dpMatch" style="margin-top:10px">입금대기 주문과 매칭</button>
    <div id="dpRes"></div></div>`;
  openPane();
  const go=async files=>{files=[...files].filter(f=>/\.(xlsx|xls|csv|txt)$/i.test(f.name));if(!files.length){toast('엑셀(.xlsx·.xls) 또는 CSV 파일을 올려 주세요');return}
    const m=$('xlMsg');m.textContent='파일 읽는 중…';
    try{let n=0;for(const f of files){const r=await xlRead(f);DP.rows=DP.rows.concat(r);n+=r.length}
      dpRowsRender();m.textContent=`입금 ${n}건을 읽었어요 (출금·0원 줄은 뺌). 아래 [매칭]을 눌러 주세요`;if(n)dpMatch()}catch(e){m.textContent='❌ '+e.message}};
  $('xlFile').addEventListener('change',e=>go(e.target.files));
  const d=$('xlDrop');['dragenter','dragover'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.add('on')}));['dragleave','drop'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.remove('on')}));
  d.addEventListener('drop',e=>go(e.dataTransfer.files||[]));
  $('dpAdd').onclick=()=>{DP.rows.push({date:'',name:'',amount:''});dpRowsRender()};$('dpMatch').onclick=dpMatch;dpRowsRender();
}

let CPN=null,CPON=false;
async function renderCpn(force){
  const m=$('main');
  if(!CPN||force){m.innerHTML='<div class="spin">불러오는 중…</div>';try{const r=await call('adminCoupons',{});CPN=r.coupons;CPON=r.featureOn===true}catch(e){m.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}}
  if(TAB!=='cpn')return;
  m.innerHTML=`<div class="sec master"><h3>할인쿠폰 기능 전체 <span class="badge ${CPON?'b5':'bx'}" id="cpState">${CPON?'ON (가동 중)':'OFF (숨김 중)'}</span></h3>
      <p class="ps">${CPON?'주문 페이지 주문서에 할인 코드 칸이 보이고, 아래 \'사용 중\' 코드를 쓸 수 있어요.':'주문 페이지에 할인 코드 칸이 전혀 보이지 않아요. 켜면 아래 \'사용 중\' 코드가 바로 쓰입니다.'}</p>
      <button class="btn w ${CPON?'ghost':'pk'}" type="button" id="cpMaster">${CPON?'할인쿠폰 기능 끄기 (OFF · 숨김)':'할인쿠폰 기능 켜기 (ON · 가동)'}</button></div>
    <div class="sec"><h3>🎟 새 할인 코드 만들기</h3><div class="cpform">
      <label>코드 (영문·숫자)<input id="cfCode" placeholder="예: OPEN" autocomplete="off"></label>
      <label>쿠폰 이름<input id="cfName" placeholder="예: 오픈기념 1만원 할인"></label>
      <div class="seg seg2" id="cfType"><button type="button" data-ct="AMOUNT" class="on">정액 (원)</button><button type="button" data-ct="PERCENT">정률 (%)</button></div>
      <label><span id="cfVL">할인 금액 (원, 입금액에서 그대로 빠짐)</span><input id="cfVal" type="number" inputmode="numeric" min="1"></label>
      <label>최소 주문금액 (공급가, 원)<input id="cfMin" type="number" inputmode="numeric" placeholder="없으면 비워 두기"></label>
      <label id="cfMaxL" hidden>최대 할인 금액 (원)<input id="cfMax" type="number" inputmode="numeric" placeholder="없으면 비워 두기"></label>
      <label>만료일<input id="cfExp" type="date"></label>
      <label>총 발행 수량 (선착순 · 비우면 무제한)<input id="cfFirst" type="number" inputmode="numeric" placeholder="없으면 비워 두기"></label>
      <label class="kmchk"><input type="checkbox" id="cfWeb" checked> 주문 페이지 직접 주문 전용 (WEB_ONLY · 끄면 카톡 등록에도 사용 가능)</label>
      <button class="btn w pk" type="button" id="cfGo">할인 코드 저장</button><p class="ps">같은 코드로 저장하면 내용이 고쳐집니다 (사용 수는 유지). 할인 금액은 입금액(VAT 포함)에서 그대로 빠집니다.</p></div></div>
    ${CPN.length?CPN.map(c=>`<article class="cpc${c.active?'':' off'}"><div class="row1"><div class="who">${esc(c.code)} <small>${esc(c.name)}</small></div>
        <button type="button" class="tg${c.active?' on':''}" data-tg="${esc(c.code)}" aria-pressed="${c.active}">${c.active?'사용 중':'중지됨'}</button></div>
      <div class="ps">${c.type==='PERCENT'?`${c.value}% 할인${c.max?` (최대 ${won(c.max)})`:''}`:`${won(c.value)} 할인`} · 최소 ${c.min?won(c.min):'없음'}(공급가) · ${c.channel==='ALL'?'웹·카톡':'웹 주문 전용'} · 횟수 무제한 · 만료 ${esc(c.exp||'없음')}</div>
      <div class="kv"><span>사용</span><span>${c.used}회${c.total?` / ${c.total}장`:''} · 할인 합계 ${won(c.discSum)}</span></div>
      ${c.active&&!CPON?'<div class="ps" style="color:#b06a00;font-weight:800">전체 스위치가 OFF라 고객에게는 아직 안 보여요</div>':''}
      ${c.orders.length?`<ul class="hist">${c.orders.map(o=>`<li>${esc(o.date)} · <button type="button" class="lnk" data-open="${esc(o.po)}">${esc(o.po)}</button> · ${esc(o.shop)} · -${won(o.disc)}</li>`).join('')}</ul>`:''}
      <button type="button" class="lnk" data-cedit="${esc(c.code)}">내용 고치기</button></article>`).join(''):'<div class="empty">할인 코드가 없습니다</div>'}`;
  let ty='AMOUNT';
  m.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{ty=b.dataset.ct;m.querySelectorAll('[data-ct]').forEach(x=>x.classList.toggle('on',x===b));$('cfVL').textContent=ty==='PERCENT'?'할인율 (%, VAT 포함 상품금액 기준)':'할인 금액 (원, 입금액에서 그대로 빠짐)';$('cfMaxL').hidden=ty!=='PERCENT'});
  m.querySelectorAll('[data-cedit]').forEach(b=>b.onclick=()=>{const c=CPN.find(x=>x.code===b.dataset.cedit);$('cfCode').value=c.code;$('cfName').value=c.name;$('cfVal').value=c.value;$('cfMin').value=c.min||'';$('cfMax').value=c.max||'';$('cfExp').value=c.exp||'';$('cfFirst').value=c.total||'';$('cfWeb').checked=c.channel!=='ALL';
    m.querySelector(`[data-ct="${c.type}"]`).click();scrollTo(0,0);$('cfCode').focus()});
  m.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const c=CPN.find(x=>x.code===b.dataset.tg);b.disabled=true;
    try{await call('adminToggleCoupon',{code:c.code,active:!c.active});c.active=!c.active;toast(`${c.code} ${c.active?'사용 시작':'사용 중지'}`);renderCpn()}catch(e){toast(e.message);b.disabled=false}});
  $('cpMaster').onclick=async e=>{const on=!CPON,b=e.target;
    if(!confirm(on?'할인쿠폰 기능을 켭니다. 주문 페이지에 할인 코드 칸이 바로 보입니다. 켤까요?':'할인쿠폰 기능을 끕니다. 주문 페이지에서 할인 코드 칸이 사라집니다. 끌까요?'))return;
    b.disabled=true;try{await call('adminSetCouponFeature',{on});CPON=on;toast(on?'할인쿠폰 기능 ON — 주문 페이지에 바로 반영됩니다':'할인쿠폰 기능 OFF — 숨김 처리했습니다');renderCpn()}catch(x){toast(x.message);b.disabled=false}};
  $('cfGo').onclick=async e=>{const b=e.target;b.disabled=true;
    try{const r=await call('adminSaveCoupon',{code:$('cfCode').value,name:$('cfName').value,type:ty,value:$('cfVal').value,min:$('cfMin').value,max:$('cfMax').value,exp:$('cfExp').value,total:$('cfFirst').value,channel:$('cfWeb').checked?'WEB_ONLY':'ALL'});
      toast(`${r.code} ${r.created?'만들었습니다':'고쳤습니다'}`);renderCpn(true)}catch(x){toast(x.message);b.disabled=false}};
}

/* ---------- 이벤트 ---------- */
$('lGo').addEventListener('click',login);$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('out').addEventListener('click',()=>logout(''));
$('reload').addEventListener('click',()=>{STK=null;load()});
$('pX').addEventListener('click',closePane);
$('kmOpen').addEventListener('click',kmPane);$('dpOpen').addEventListener('click',dpPane);$('xlOpen').addEventListener('click',xlPane);$('pane').addEventListener('click',e=>{if(e.target===$('pane'))closePane()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePane()});
$('q').addEventListener('input',e=>{Q=e.target.value.trim();renderOrders()});
document.addEventListener('click',e=>{
  const sp=e.target.closest('[data-stp]');if(sp){STP=sp.dataset.stp;renderSta();return}
  const t=e.target.closest('[data-tab],[data-f],[data-next],[data-open],[data-agg],[data-inv]');if(!t)return;
  if(t.dataset.tab){TAB=t.dataset.tab;scrollTo(0,0);render()}
  else if(t.dataset.f){F=t.dataset.f;renderOrders();scrollTo(0,0)}
  else if(t.dataset.agg){AGG=t.dataset.agg;renderAgg()}
  else if(t.dataset.open)detail(t.dataset.open);
  else if(t.dataset.inv)detail(t.dataset.inv,true);
  else if(t.dataset.next){const o=S.orders.find(x=>x.po===t.dataset.next);const i=sIdx(o.status);if(i===4)detail(o.po,true);else setStage(o.po,STAGES[i+1],{},t)}
});
if(PIN)call('adminLogin',{}).then(start,()=>logout(''));
</script>
</body>
</html>
