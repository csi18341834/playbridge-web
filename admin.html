<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>플레이브릿지 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 관리자 화면: 이동 중 휴대폰 한 손(엄지)으로 주문 진행 단계를 넘기는 화면. 주문 페이지(index.html)와 같은 색·글꼴 */
:root{color-scheme:light;--bg:#fffaf0;--card:#fff;--ink:#1d1a2b;--sub:#5d5872;--line:#ece4d2;--y:#ffd23f;--pk:#ff3d7f;--pk2:#ffe3ec;--ok:#0b7a4b;--soft:#f6f0ff;
  --s0:#8a6a00;--s0b:#fff3c4;--s1:#0b7a4b;--s1b:#dff5ea;--s2:#c2410c;--s2b:#ffe8d9;--s3:#1d63b8;--s3b:#dfeeff;--s4:#6d3fd6;--s4b:#ece4ff;--s5:#1d1a2b;--s5b:#e9e7ef;--cx:#777;--cxb:#eee}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere;overflow-x:clip;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
/* 로그인 */
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
#login .box{width:100%;max-width:360px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px 20px;text-align:center}
#login h1{margin:0 0 4px;font-size:22px;font-weight:900}
#login p{margin:0 0 16px;color:var(--sub);font-size:15px}
#pin{width:100%;min-height:56px;border:2px solid var(--ink);border-radius:14px;text-align:center;font-size:24px;font-weight:900;letter-spacing:.3em;background:#fff}
.big{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--pk);color:#fff;font-size:18px;font-weight:900;margin-top:12px}
.big:disabled{opacity:.5}
.err{color:#c0392b;font-weight:700;font-size:15px;min-height:1.5em;margin-top:8px}
/* 머리 (위에 고정) */
header{position:sticky;top:0;z-index:20;background:var(--y);padding:10px 16px 0;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{font-size:12px;font-weight:700;color:var(--sub)}
.ib{min-height:40px;padding:0 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:14px;font-weight:900;white-space:nowrap}
.sub{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:10px}
.sub button{min-height:44px;border:0;border-radius:12px 12px 0 0;background:rgba(255,255,255,.55);font-size:14px;font-weight:900;line-height:1.2;padding:4px 2px}
.sub button.on{background:var(--bg)}
.bar{background:var(--bg);margin:0 -16px;padding:10px 16px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 12px;border:2px solid var(--line);border-radius:999px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip b{min-width:22px;padding:0 6px;border-radius:99px;background:var(--soft);font-size:13px;text-align:center}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}.chip.on b{background:var(--pk);color:#fff}
.sbox{display:flex;gap:6px;margin-top:6px}
.sbox input{flex:1;min-height:46px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:16px}
.sbox button{flex:none}
main{padding:10px 16px}
.warnpin{margin:10px 16px 0;padding:10px 12px;border-radius:12px;background:var(--pk2);color:#a3123f;font-size:14px;font-weight:700}
/* 주문 카드 */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;margin:0 0 12px;overflow:hidden}
.card .hd{display:block;width:100%;border:0;background:none;text-align:left;padding:14px 14px 10px}
.row1{display:flex;align-items:flex-start;gap:8px}
.row1 .who{flex:1;font-size:18px;font-weight:900;line-height:1.35}
.row1 .who small{font-size:15px;font-weight:700;color:var(--sub)}
.badge{flex:none;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:900;white-space:nowrap}
.b0{background:var(--s0b);color:var(--s0)}.b1{background:var(--s1b);color:var(--s1)}.b2{background:var(--s2b);color:var(--s2)}.b3{background:var(--s3b);color:var(--s3)}.b4{background:var(--s4b);color:var(--s4)}.b5{background:var(--s5b);color:var(--s5)}.bx{background:var(--cxb);color:var(--cx)}
.po{font-size:13px;color:var(--sub);font-weight:700;margin-top:2px}
.sum{margin-top:6px;font-size:15px}
.sum b{font-size:17px;font-weight:900}
.req{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff3c4;border:1px solid #f1d36b;font-size:14px;font-weight:700}
.amemo{margin-top:6px;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amemo::before{content:'📝 '}
.inv{margin-top:6px;font-size:14px;font-weight:700;color:var(--ok)}
.next{display:flex;gap:6px;padding:0 14px 14px}
.next button{flex:1;min-height:56px;border:0;border-radius:14px;font-size:17px;font-weight:900;color:#fff}
.n0{background:var(--s1)}.n1{background:var(--s2)}.n2{background:var(--s3)}.n3{background:var(--s4)}.n4{background:var(--pk)}
.next button:disabled{opacity:.55}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fl{padding:2px 10px;border-radius:8px;font-size:13px;font-weight:900;white-space:nowrap}
.fl.red{background:#d92d20;color:#fff}.fl.warn{background:#fff1e6;color:#c2410c;border:1.5px solid #f59f6b}
.chk{display:flex;gap:10px;align-items:center;min-height:48px;margin-top:10px;padding:8px 10px;border-radius:12px;background:#fff0f0;font-weight:900;font-size:15px}
.chk input{width:24px;height:24px;flex:none;accent-color:#d92d20}
.hist{list-style:none;margin:0;padding:0;font-size:14px;color:var(--sub)}.hist li{padding:4px 0;border-bottom:1px dashed var(--line)}.hist li:first-child{color:var(--ink);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-weight:700}
/* 상세 창 */
#pane{position:fixed;inset:0;z-index:50;background:rgba(29,26,43,.45);display:flex;align-items:flex-end;justify-content:center}
#pane .sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overscroll-behavior:contain}
#pane .ph{display:flex;gap:8px;align-items:flex-start;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#pane .ph h2{flex:1;margin:0;font-size:19px;font-weight:900;line-height:1.35}
#pane .x{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--soft);font-size:24px;font-weight:900;line-height:1}
#pane .pb{overflow-y:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sec{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.sec h3{margin:0 0 8px;font-size:16px;font-weight:900}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stepper button{min-height:58px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:14px;font-weight:900;line-height:1.25;padding:4px}
.stepper button small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.stepper button.done{background:var(--soft)}
.stepper button.cur{border-color:var(--ink);background:var(--ink);color:#fff}.stepper button.cur small{color:#ddd}
.cxrow{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.cxbtn{min-height:44px;padding:0 14px;border:2px solid #d33;border-radius:12px;background:#fff;color:#c00;font-weight:900;font-size:15px}
.cxbox{margin-top:8px;padding:10px;border-radius:12px;background:#fff0f0}
.cxbox label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px}
.cxbox input{width:22px;height:22px}
textarea{width:100%;min-height:84px;border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-size:16px;resize:vertical}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.qchips button{min-height:38px;padding:0 10px;border:1px solid var(--line);border-radius:99px;background:var(--soft);font-size:14px;font-weight:700}
.btn{min-height:50px;padding:0 16px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-size:16px;font-weight:900}
.btn.w{width:100%}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.pk{background:var(--pk)}
.btn:disabled{opacity:.5}
.cour{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:8px}
.cour button{min-height:46px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:14px;font-weight:900;padding:0 2px}
.cour button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.f{width:100%;min-height:52px;border:2px solid var(--ink);border-radius:12px;padding:0 12px;background:#fff;font-size:18px;font-weight:700;letter-spacing:.02em}
.gap{display:grid;gap:8px;margin-top:8px}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.items li:last-child{border-bottom:0}
.items li b{flex:none;white-space:nowrap}
.op{display:block;color:var(--pk);font-weight:700;font-size:14px}
.ps{display:block;color:var(--sub);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:2px 0}
.kv.t{font-size:18px;font-weight:900;border-top:2px solid var(--ink);margin-top:6px;padding-top:6px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.contact a,.contact button{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;font-weight:900;text-decoration:none;font-size:16px}
.contact a{background:var(--ok);color:#fff}
.contact button{border:2px solid var(--ink);background:#fff}
.addr{font-size:15px;line-height:1.5}
/* 합계·피킹 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{min-height:48px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:900;font-size:14px;line-height:1.25}
.seg button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.agg{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.agg .t{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.agg .t span{font-weight:900;font-size:16px}
.agg .t b{flex:none;font-size:20px;font-weight:900;color:var(--pk);white-space:nowrap}
.agg .m{font-size:13px;color:var(--sub)}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:17px;padding:4px 2px 10px}
.pick li{align-items:center}
.pick label{display:flex;gap:10px;align-items:center;flex:1}
.pick input{width:24px;height:24px;flex:none}
.stk{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.stk>span{flex:1}.stk>b,.stk>a{flex:none;white-space:nowrap}
.out{color:#c00}
/* 알림 (위쪽) */
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:80;width:calc(100% - 24px);max-width:520px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast span{flex:1}
#toast button{flex:none;min-height:40px;padding:0 12px;border:0;border-radius:10px;background:var(--y);color:var(--ink);font-weight:900}
.spin{text-align:center;padding:30px;color:var(--sub);font-weight:700}
.rsdue{border:2px solid var(--ok)}.rsg{margin:8px 0 12px}.rsg>b{display:block;font-size:16px}
.rst{font-style:normal;font-size:12px;font-weight:800;padding:1px 6px;border-radius:6px;background:#eee;color:#666;white-space:nowrap}.rst.on{background:#e3f6ec;color:var(--ok)}
.seg4{grid-template-columns:repeat(4,1fr)}.seg4 button{min-height:42px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.kpi{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.kpi span{display:block;font-size:13px;font-weight:800;color:var(--sub)}.kpi b{display:block;font-size:22px;line-height:1.3}.kpi small{display:block;font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;height:150px;align-items:end;margin-top:8px}.bc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bc i{display:block;width:70%;min-height:2px;background:var(--pk);border-radius:6px 6px 0 0}.bc span{font-size:12px;font-weight:800;margin-top:4px}.bc small{font-size:11px;color:var(--sub)}
#adminStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 0}#adminStats[hidden]{display:none}
.ast{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}.ast span{display:block;font-size:13px;font-weight:800;color:var(--sub)}
.ast b{display:block;font-size:22px;line-height:1.3}.ast small{display:block;font-size:13px;color:var(--sub);overflow-wrap:anywhere}.ast.hot{border-color:var(--pk)}.ast.hot b{color:var(--pk)}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h1>플레이브릿지 관리</h1>
    <p>주문 진행 관리 · 관리자 전용</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" aria-label="관리자 비밀번호">
    <div class="err" id="lErr" role="alert"></div>
    <button class="big" id="lGo" type="button">들어가기</button>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="top"><h1>주문 관리 <small id="upd"></small></h1><button class="ib" id="reload" type="button">새로고침</button><button class="ib" id="out" type="button">나가기</button></div>
    <div class="sub" role="tablist">
      <button type="button" data-tab="ord" class="on">주문<br>진행관리</button>
      <button type="button" data-tab="agg">1688발주·<br>품목합계</button>
      <button type="button" data-tab="stk">재고·<br>입고알림</button>
      <button type="button" data-tab="sta">📊<br>간단 통계</button>
    </div>
    <div class="bar" id="ordBar">
      <div class="chips" id="chips"></div>
      <div class="sbox"><input id="q" type="search" placeholder="거래처·주문자·뒷자리·발주번호" aria-label="주문 검색"></div>
    </div>
  </header>
  <div class="warnpin" id="weak" hidden>관리자 비밀번호가 짧습니다. 시트 '설정' 탭의 '관리자비밀번호'를 8자리 이상으로 바꿔 주세요.</div>
  <section id="adminStats" aria-label="주문 요약" hidden></section>
  <main id="main"><div class="spin">불러오는 중…</div></main>
</div>

<div id="pane" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pT"><div class="ph"><h2 id="pT"></h2><button class="x" type="button" id="pX" aria-label="닫기">×</button></div><div class="pb" id="pB"></div></div></div>
<div id="toast" hidden role="status"><span id="tMsg"></span><button type="button" id="tUndo" hidden>되돌리기</button></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbwyEpDKKX4pif4FgYtxrepxrqzmCJDM4NmHcb29SrzkMXCPEHMVAwYxdtpEuCwtFCGxyw/exec';
const STAGES=['입금대기','입금확인(발주전)','1688발주완료','중국배송출발','한국도착(통관)','국내발송완료'],CANCEL='취소';
const NEXT_LABEL=['입금 확인 완료','1688 발주 체크','중국배송 출발 체크','한국 도착 체크','국내 송장 입력'];
const COURIERS=['로젠','한진','CJ대한통운','우체국'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const sIdx=s=>s===CANCEL?-1:STAGES.indexOf(s);
const bCls=s=>s===CANCEL?'bx':'b'+Math.max(0,STAGES.indexOf(s));
const store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
let PIN=store.get('pb_admin')||'',S={orders:[],counts:{}},F='전체',Q='',TAB='ord',AGG='buy',STK=null,openPo='',STP='7d';

/* 서버 호출 (text/plain → 사전요청 없이 Apps Script doPost) */
function call(action,payload){
  return fetch(API_URL,{method:'POST',body:JSON.stringify({action,payload:Object.assign({pin:PIN},payload||{})}),redirect:'follow'})
    .then(r=>{if(!r.ok)throw new Error('서버 연결이 원활하지 않습니다. 잠시 후 다시 시도해 주세요.');return r.json()})
    .then(j=>{if(!j||!j.ok){const m=(j&&j.error)||'처리하지 못했습니다.';if(/비밀번호/.test(m)&&action!=='adminLogin')logout(m);throw new Error(m)}return j.data});
}
let tT=0;
function toast(msg,undo){$('tMsg').textContent=msg;const u=$('tUndo');u.hidden=!undo;u.onclick=()=>{$('toast').hidden=true;undo&&undo()};$('toast').hidden=false;clearTimeout(tT);tT=setTimeout(()=>$('toast').hidden=true,undo?7000:3000)}
function copy(t,msg){const ok=()=>toast(msg||'복사되었습니다');if(navigator.clipboard&&isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>fb());else fb();
  function fb(){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('복사하지 못했습니다')}a.remove()}}

/* ---------- 로그인 ---------- */
async function login(){
  const p=$('pin').value.trim();if(!p){$('lErr').textContent='비밀번호를 적어주세요.';return}
  $('lGo').disabled=true;$('lErr').textContent='';PIN=p;
  try{const r=await call('adminLogin',{});store.set('pb_admin',p);start(r)}
  catch(e){PIN='';$('lErr').textContent=e.message}finally{$('lGo').disabled=false}
}
function logout(msg){PIN='';store.set('pb_admin',null);$('app').hidden=true;$('login').hidden=false;closePane();$('pin').value='';if(msg)$('lErr').textContent=msg}
function start(r){$('login').hidden=true;$('app').hidden=false;$('weak').hidden=!(r&&r.weakPin);load()}

/* ---------- 데이터 ---------- */
async function load(){
  $('reload').disabled=true;
  try{const r=await call('adminSummary',{});S=r;$('upd').textContent=r.at+' 기준';render();if(openPo)detail(openPo)}
  catch(e){if(PIN)$('main').innerHTML=`<div class="empty">${esc(e.message)}<br><br><button class="btn" type="button" onclick="load()">다시 불러오기</button></div>`}
  finally{$('reload').disabled=false}

function recount(){const c={전체:S.orders.length};STAGES.concat(CANCEL).forEach(s=>c[s]=0);S.orders.forEach(o=>c[o.status]=(c[o.status]||0)+1);S.counts=c}
function putOrder(o){const i=S.orders.findIndex(x=>x.po===o.po);if(i>=0)S.orders[i]=o;else S.orders.unshift(o);recount()}

/* 품명: '[캐릭터] 이름 (구성) [옵션]' → 이름 / 옵션 / 구성 */
function nm(n){const t=String(n||''),pre=(t.match(/^\s*\[[^\]]*\]\s*/)||[''])[0],r=t.slice(pre.length),op=(r.match(/\[[^\]]*\]/g)||[]).map(x=>x.slice(1,-1)),pa=(r.replace(/\[[^\]]*\]/g,'').match(/\([^)]*\)/g)||[]),main=r.replace(/\[[^\]]*\]|\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();return{main:(pre.trim()+' '+main).trim(),short:main||t,op:op.join(' · '),pa:pa.join(' ')}}
function packOf(u){return Number((String(u).match(/(\d+)\s*(?:EA|개|입|pcs)/i)||[])[1])||1}

/* ---------- 주문별 진행관리 ---------- */
function chips(){const L=['전체'].concat(STAGES,CANCEL);$('chips').innerHTML=L.map(s=>`<button type="button" class="chip${s===F?' on':''}" data-f="${esc(s)}">${esc(s)}<b>${S.counts[s]||0}</b></button>`).join('')}
function match(o){if(F!=='전체'&&o.status!==F)return false;if(!Q)return true;const q=Q.replace(/\s/g,'').toLowerCase();return [o.shop,o.who,o.po,o.tel.replace(/\D/g,'').slice(-4),o.tel.replace(/\D/g,'')].some(x=>String(x).replace(/\s/g,'').toLowerCase().includes(q))}
/* 주문일로부터 며칠 지났는지 (한국 날짜 기준) */
const kday=t=>Math.floor((t+9*3600e3)/864e5);
function unpaidDays(o){return o.status===STAGES[0]&&o.ts?kday(Date.now())-kday(o.ts):0}
function card(o){
  const i=sIdx(o.status),first=nm((o.items[0]||{}).n),dn=unpaidDays(o);
  const flags=(o.partial?'<span class="fl red">부분발송</span>':'')+(dn>=2?`<span class="fl warn">미입금 D+${dn}일</span>`:'');

  return `<article class="card" id="c-${esc(o.po)}">

      <div class="sum">${esc(first.short)}${o.items.length>1?` 외 ${o.items.length-1}종`:''} · 총 ${o.packs}팩 · <b>${won(o.total)}</b></div>
      ${o.memo?`<div class="req">${esc(o.memo)}</div>`:''}
      ${o.adminMemo?`<div class="amemo">${esc(o.adminMemo.split('\n').filter(Boolean).pop())}</div>`:''}
      ${o.invoice?`<div class="inv">🚚 ${esc(o.courier)} ${esc(o.invoice)}</div>`:''}
    </button>${nextBtn}</article>`;
}
function renderOrders(){
  chips();
  const L=S.orders.filter(match);
  $('main').innerHTML=L.length?L.map(card).join(''):`<div class="empty">${Q?'검색 결과가 없습니다':esc(F)+' 주문이 없습니다'}</div>`;

/* 단계 바꾸기 (되돌리기 지원) */
async function setStage(po,status,extra,btn){
  const o=S.orders.find(x=>x.po===po);if(!o)return;
  const prev=o.status;if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='저장 중…'}
  try{
    const r=await call('adminUpdateStatus',Object.assign({po,status},extra||{}));putOrder(r.order);render();if(openPo===po)detail(po);
    const back=r.prev;
    toast(`${o.shop} → ${r.order.status}${r.restored&&r.restored.length?' · 재고 '+r.restored.map(x=>`${x.c} ${x.from}→${x.to}`).join(', '):''}`,
      back!==r.order.status&&r.order.status!==STAGES[5]?()=>setStage(po,back,(extra&&extra.restoreStock)?{restoreStock:true}:{}):null);

}

/* ---------- 간단 통계 (불러온 주문으로 화면에서 계산, 취소 주문은 금액에서 뺌) ---------- */
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function renderSta(){
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const P={today:['오늘',t0],'7d':['최근 7일',t0-6*864e5],month:['이번 달',new Date(now.getFullYear(),now.getMonth(),1).getTime()],all:['전체',0]};
  const all=S.orders.filter(o=>o.ts>=P[STP][1]),live=all.filter(o=>o.status!==CANCEL),wait=live.filter(o=>o.status===STAGES[0]),paid=live.filter(o=>o.status!==STAGES[0]);
  const sum=L=>L.reduce((a,o)=>a+(o.total||0),0),shops=new Set(live.map(o=>o.shop||o.who));
  const prod={},cust={};live.forEach(o=>{o.items.forEach(t=>{const k=t.c,x=prod[k]||(prod[k]={n:nm(t.n).main,q:0,sum:0});x.q+=t.q;x.sum+=t.sum});const c=cust[o.shop||o.who]||(cust[o.shop||o.who]={n:o.shop||o.who,cnt:0,sum:0});c.cnt++;c.sum+=o.total||0});
  const top=(m,k)=>Object.values(m).sort((a,b)=>b[k]-a[k]).slice(0,5);
  const days=[...Array(7)].map((_,i)=>{const t=t0-(6-i)*864e5,k=dayKey(t),L=S.orders.filter(o=>o.status!==CANCEL&&o.ts&&dayKey(o.ts)===k);return {lab:(new Date(t).getMonth()+1)+'/'+new Date(t).getDate(),n:L.length,sum:sum(L)}});
  const mx=Math.max(1,...days.map(d=>d.sum));
  const card=(lab,val,sub)=>`<div class="kpi"><span>${lab}</span><b>${val}</b>${sub?`<small>${sub}</small>`:''}</div>`;
  $('main').innerHTML=`<div class="seg seg4">${Object.keys(P).map(k=>`<button type="button" data-stp="${k}" class="${STP===k?'on':''}">${P[k][0]}</button>`).join('')}</div>
    <div class="kpis">${card('주문',live.length+'건',won(sum(live)))}${card('입금 확인',paid.length+'건',won(sum(paid)))}${card('입금 대기',wait.length+'건',won(sum(wait)))}${card('평균 주문',live.length?won(Math.round(sum(live)/live.length)):'-',`거래처 ${shops.size}곳 · 취소 ${all.length-live.length}건`)}</div>
    <div class="sec"><h3>최근 7일 주문금액 <span class="ps">(취소 제외)</span></h3><div class="bars">${days.map(d=>`<div class="bc"><i style="height:${Math.round(d.sum/mx*100)}%" title="${won(d.sum)}"></i><span>${d.lab}</span><small>${d.n}건</small></div>`).join('')}</div></div>
    <div class="sec"><h3>많이 나간 상품 TOP 5 <span class="ps">(${P[STP][0]})</span></h3>${Object.keys(prod).length?top(prod,'q').map((x,i)=>`<div class="stk"><span>${i+1}. ${esc(x.n)}</span><b>${x.q}팩</b></div>`).join(''):'<div class="ps">주문이 없습니다</div>'}</div>
    <div class="sec"><h3>거래처별 주문 TOP 5 <span class="ps">(${P[STP][0]})</span></h3>${Object.keys(cust).length?top(cust,'sum').map((x,i)=>`<div class="stk"><span>${i+1}. ${esc(x.n)}<span class="ps">${x.cnt}건</span></span><b>${won(x.sum)}</b></div>`).join(''):'<div class="ps">주문이 없습니다</div>'}</div>
    <p class="ps">금액은 입금액(VAT·배송비 포함) 기준, 취소 주문은 빼고 셉니다. 위 '새로고침'을 누르면 최신 주문으로 다시 계산합니다.</p>`;
}

/* ---------- 주문 탭 위 요약 4칸 (오늘·이번 달·진행 중·취소). render()가 불릴 때마다 S.orders로 다시 계산 ---------- */
const numOf=v=>Number(String(v==null?'':v).replace(/[^0-9.-]/g,''))||0;   // 금액·시각이 글자로 와도 안전하게 숫자로
function tsOf(o){const t=numOf(o.ts||o.time||o.timestamp);if(t>1e11)return t;const d=Date.parse(o.date||o.createdAt||'');return isNaN(d)?0:d}
function amtOf(o){return numOf(o.total!=null&&o.total!==''?o.total:(o.sum!=null?o.sum:o.amount))}
function renderAdminStats(orders){
  const box=$('adminStats');if(!box)return;
  const L=Array.isArray(orders)?orders:[],now=new Date();
  const d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const live=L.filter(o=>o.status!==CANCEL),sum=a=>a.reduce((x,o)=>x+amtOf(o),0);
  const today=live.filter(o=>tsOf(o)>=d0),month=live.filter(o=>tsOf(o)>=m0);
  const doing=live.filter(o=>o.status!==STAGES[5]).length,cxl=L.length-live.length;
  const c=(lab,val,sub,cls)=>`<div class="ast${cls?' '+cls:''}"><span>${lab}</span><b>${val}</b><small>${sub}</small></div>`;
  box.innerHTML=c('오늘 주문',today.length+'건',won(sum(today)))+c('이번 달 누계',month.length+'건',won(sum(month)))+c('진행 중',doing+'건','발송 전 처리 필요',doing?'hot':'')+c('취소',cxl+'건','전체 기간');
}

function render(){
  $('ordBar').hidden=TAB!=='ord';
  $('adminStats').hidden=TAB!=='ord';if(TAB==='ord')renderAdminStats(S.orders);
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  if(TAB==='ord')renderOrders();else if(TAB==='agg')renderAgg();else if(TAB==='sta')renderSta();else renderStk();
}

/* ---------- 이벤트 ---------- */
$('lGo').addEventListener('click',login);$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('out').addEventListener('click',()=>logout(''));
$('reload').addEventListener('click',()=>{STK=null;load()});
$('pX').addEventListener('click',closePane);$('pane').addEventListener('click',e=>{if(e.target===$('pane'))closePane()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePane()});
$('q').addEventListener('input',e=>{Q=e.target.value.trim();renderOrders()});
document.addEventListener('click',e=>{
  const sp=e.target.closest('[data-stp]');if(sp){STP=sp.dataset.stp;renderSta();return}
  const t=e.target.closest('[data-tab],[data-f],[data-next],[data-open],[data-agg],[data-inv]');if(!t)return;
  if(t.dataset.tab){TAB=t.dataset.tab;scrollTo(0,0);render()}
  else if(t.dataset.f){F=t.dataset.f;renderOrders();scrollTo(0,0)}
  else if(t.dataset.agg){AGG=t.dataset.agg;renderAgg()}
  else if(t.dataset.open)detail(t.dataset.open);
  else if(t.dataset.inv)detail(t.dataset.inv,true);
  else if(t.dataset.next){const o=S.orders.find(x=>x.po===t.dataset.next);const i=sIdx(o.status);if(i===4)detail(o.po,true);else setStage(o.po,STAGES[i+1],{},t)}
});
if(PIN)call('adminLogin',{}).then(start,()=>logout(''));
</script>
